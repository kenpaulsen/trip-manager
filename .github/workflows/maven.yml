name: Java CI

on: [push]

jobs:
  build:

    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '25'
    - name: Install libheif (chat-photo HEIC decode)
      # The HEIC pipeline test runs its real-decode branch only where libheif is present (it degrades to
      # asserting the graceful rejection elsewhere). CI is where the coverage gate blocks, so CI gets the
      # library and genuinely exercises the decode path. The unversioned .so lives in libheif-dev, and the
      # HEVC decoder is its own plugin package that --no-install-recommends would skip -- without it libheif
      # loads, reports its version, and fails to decode every actual iPhone photo.
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libheif-dev libheif-plugin-libde265
    - name: Build with Maven
      # -Djacoco.check.halt=true arms the coverage gate (90% overall, 90% per class): GitHub is the ONE place
      # a coverage regression blocks. Locally and in the CodePipeline buildspec the same check only reports.
      run: mvn -B package --file pom.xml -Djacoco.check.halt=true
    # JaCoCo's report is written during `test`, so `package` above has already produced it.
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-coverage
        path: '*/target/site/jacoco/'
        if-no-files-found: warn
