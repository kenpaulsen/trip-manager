# E-mail text (docs/i18n.md). Always formatted for the RECIPIENT's language (i18n/ReaderLanguage), never the
# sender's or the request's. Names are arguments and stand alone. The mail.chat.body.* and mail.digest.lead*
# values carry their own markup and are formatted through MailTemplates.html, which HTML-escapes every argument:
# that is why a possessive is written &#39;s there. Every other value is plain text, escaped by the template.
