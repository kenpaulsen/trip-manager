# The words our PDFs draw (docs/i18n.md): the budget, the expense report, the Room Invoice and the signed copy
# of a trip document. Always formatted for the READER's language, which the caller names: a PDF may be mailed
# or kept, so the request's language is not assumed. Money, dates and names arrive as arguments, already
# formatted. A label or column title must stay SHORT: it is drawn in a fixed column.

