labels.exportField.registrationType=Tipo de inscripción
labels.exportField.discountCode=Código de descuento
labels.exportField.checkedIn=Llegada registrada
labels.exportField.paymentMethod=Método de pago
labels.exportField.paymentReference=Referencia de pago
labels.exportField.paymentReceived=Pago recibido
