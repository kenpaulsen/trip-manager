# --- Settings page sections ---
labels.settingSection.site.title=Sitio
labels.settingSection.branding.title=Identidad visual
labels.settingSection.branding.note=El aspecto del sitio propio de una ORGANIZACIÓN, definido por la organización en su página Apariencia. El sitio de una organización nunca hereda el aspecto del sitio compartido, y el logotipo, el pie de página y los contactos del sitio compartido están fijos en sus páginas -- así que un valor puesto aquí, en la página Configuración del sitio, no se aplica a nada.
labels.settingSection.emailAddresses.title=Direcciones de correo
labels.settingSection.emailAddresses.note=Todas las direcciones con las que la aplicación envía o a las que envía. Las direcciones de remitente deben estar en un dominio verificado en SES; los destinatarios y la dirección de respuesta pueden ser cualquier dirección.
labels.settingSection.performance.title=Rendimiento
labels.settingSection.performance.note=La caché cercana dentro de la JVM, delante de la caché compartida de Valkey. Solo se sirven desde ella las lecturas cuyo punto de llamada declaró Cached.YES (rutas públicas y de presentación); la autenticación, los pagos y los editores siempre la omiten.
labels.settingSection.pushNotifications.title=Notificaciones push
labels.settingSection.pushNotifications.note=Se entrega apagado: "Enviar notificaciones push" es el interruptor general, y cada ruta, cada insignia y cada actualización silenciosa dependen de él. Cada persona conserva su propio interruptor, sus horas de silencio y su elección por chat.
labels.settingSection.profilePictures.title=Fotos de perfil
labels.settingSection.homePage.title=Página de inicio
labels.settingSection.contentTemplates.title=Plantillas de contenido
labels.settingSection.chatEmail.title=Correo del chat
labels.settingSection.chatEmail.note=Nada de lo que hay aquí envía correo por sí solo. "Enviar correo del chat" es el interruptor general; con él apagado, lo demás no tiene efecto.
labels.settingSection.chatDailyDigest.title=Resumen diario del chat
labels.settingSection.chatLimits.title=Límites del chat
labels.settingSection.chatLimits.note=Los límites de ráfaga y sostenidos de cada chat están en la página de configuración del chat de cada viaje. Estos son los de todo el sitio.
labels.settingSection.chatModeration.title=Moderación del chat
labels.settingSection.chatModeration.note=Las denuncias hechas desde la aplicación llegan al destinatario de denuncias indicado abajo y se responden en un plazo de 24 horas.
labels.settingSection.chatAppearance.title=Apariencia del chat
labels.settingSection.chatInvites.title=Invitaciones al chat
labels.settingSection.chatInvites.note=Los enlaces de invitación admiten como invitados del chat a personas con cuenta que no están en el viaje (familiares, amigos). A un invitado se le puede quitar igual que a cualquier otra persona.
labels.settingSection.photoComments.title=Comentarios en fotos
labels.settingSection.photoComments.note=Hilos de comentarios y reacciones en cada foto del chat. El correo por menciones en comentarios de fotos depende del interruptor general del correo del chat, más arriba.
labels.settingSection.loginSecurity.title=Inicio de sesión y seguridad
labels.settingSection.loginSecurity.note=Los códigos de inicio de sesión por correo sirven también para recuperar una contraseña olvidada. Las direcciones de correo de esta sección se usan para esos códigos.
labels.settingSection.accountDeletion.title=Eliminación de cuentas
labels.settingSection.accountDeletion.note=Eliminación de la cuenta por la propia persona desde la aplicación nativa: desaparecen el acceso, el perfil y el contenido; los registros de inscripción y de dinero se conservan bajo un registro anonimizado.
labels.settingSection.familyAccounts.title=Cuentas familiares
labels.settingSection.registration.title=Inscripción
labels.settingSection.trips.title=Viajes
labels.settingSection.scheduledTripMessages.title=Mensajes programados del viaje
labels.settingSection.scheduledTripMessages.note=Los mensajes de cada viaje se redactan y se aprueban en su página Comunicaciones (pestaña Informes). Nada de lo que hay aquí envía correo por sí solo.
labels.settingSection.registrationEmail.title=Correo de inscripción
labels.settingSection.registrationEmail.note=Los correos que recibe la persona inscrita son plantillas de tipo MAIL que se editan en la página Plantillas sin desplegar nada (registration-received / registration-approved).
labels.settingSection.supportRequests.title=Solicitudes de soporte
labels.settingSection.supportRequests.note=Quién las recibe se gestiona en el panel "Administradores del canal de soporte", debajo de la configuración.
labels.settingSection.mobileApps.title=Aplicaciones móviles
labels.settingSection.mobileApps.note=Enlaces a las tiendas para las insignias "Obtén la aplicación" de la página de soporte. Cada uno se pone cuando su ficha en la tienda queda publicada; nada más los lee.
labels.settingSection.discover.title=Descubrir
labels.settingSection.discover.note=La lista y la búsqueda de viajes de las aplicaciones sin iniciar sesión, abiertas a cualquiera. Lo que aparece lo deciden la opción "Mostrar en la página de inicio" de cada viaje y la casilla "Sitios compartidos" de su organización, no esta sección; estos valores solo limitan la rapidez con que una dirección puede preguntar.
labels.settingSection.finance.title=Finanzas
labels.settingSection.finance.note=El presupuesto del viaje y el informe de gastos. Cada organización define su propio tesorero en su página Configuración; el valor de aquí se aplica a las organizaciones que no lo han hecho.
labels.settingSection.lodging.title=Alojamiento
labels.settingSection.lodging.note=Hoteles, opciones de alojamiento y asignación de habitaciones. Una organización que concilia a mano los cargos de alojamiento puede apagar el recálculo automático para sus propios viajes.
labels.settingSection.payments.title=Pagos
labels.settingSection.payments.note=Los ajustes de correo y de comisiones son el peldaño del SITIO en la escalera de valores predeterminados viaje → organización → sitio. La lista de direcciones de retorno permitidas solo se aplica a los pagos iniciados por la API; el pago en la web deduce su dirección de retorno de la página donde estaba quien paga y nunca la consulta.

# --- settings ---
labels.setting.site.org.name.label=Nombre de la organización
labels.setting.site.org.name.description=El nombre de la organización del sitio compartido, usado en sus páginas públicas y en avisos como el texto de licencia para subir fotos. El sitio propio de una organización muestra en su lugar el nombre que figura en el perfil de esa organización.
labels.setting.site.orgsites.baseDomain.label=Dominio base de los sitios de organizaciones
labels.setting.site.orgsites.baseDomain.description=El dominio bajo el cual viven los sitios de las organizaciones: una organización con el identificador 'acme' se sirve en acme.<este dominio>. El dominio raíz y www son el sitio de presentación. Cambiarlo solo funciona cuando el DNS y el certificado ya cubren el comodín del dominio nuevo.
labels.setting.mail.sharedDomains.label=Dominios de envío compartidos
labels.setting.mail.sharedDomains.description=Los dominios de envío verificados desde los que toda organización puede enviar, separados por comas. Cualquier otro dominio verificado es el dominio personalizado de una sola organización, y solo ella puede enviar desde él. Las direcciones de remitente del propio sitio usan únicamente estos dominios.
labels.setting.site.analytics.id.label=Id de la propiedad de analítica
labels.setting.site.analytics.id.description=La propiedad de analítica web a la que este sitio informa sus visitas: un id de medición de Google Analytics 4, que empieza con G-. En blanco significa que no hay etiqueta de analítica ni aviso de cookies. El sitio de una organización nunca hereda el id del sitio compartido: informa solo a un id que la organización haya puesto para sí misma.
labels.setting.site.languages.label=Idiomas ofrecidos
labels.setting.site.languages.description=Los idiomas que los visitantes pueden elegir, como códigos separados por comas: en para inglés, es para español, hr para croata. El primero es el predeterminado para un visitante cuyo idioma no se ofrece. Un código que el sitio no conoce se ignora, y una lista vacía significa inglés.
labels.setting.api.languages.minAppVersion.label=Primera versión de la aplicación con idiomas
labels.setting.api.languages.minAppVersion.description=La versión más antigua de la aplicación UniteTrip a la que se responde en el idioma del teléfono, por ejemplo 1.3.0. Las versiones anteriores, y todas las versiones mientras esto esté en blanco, reciben el idioma predeterminado del sitio, porque sus pantallas están solo en inglés.
labels.setting.site.theme.palette.label=Paleta de colores
labels.setting.site.theme.palette.description=El color de acento del sitio de la organización, usado en sus menús, botones y enlaces tanto en modo claro como en modo oscuro. En blanco significa el aspecto predeterminado de la plataforma.
labels.setting.site.theme.dark.label=Modo oscuro
labels.setting.site.theme.dark.description=Encendido: el sitio de la organización se dibuja con el tema oscuro de su paleta, con fondo de página, barra superior y menú oscuros. Apagado: el tema claro. Un visitante que eligió claro u oscuro para sí mismo conserva su propia elección.
labels.setting.site.layout.label=Diseño de página
labels.setting.site.layout.description=Cómo se dispone la página de inicio del sitio: classic mantiene la tarjeta de contenido junto a la barra lateral, y full-width deja que las secciones en franja, como una portada, ocupen todo el ancho de la ventana. En blanco significa classic. Las demás páginas mantienen el diseño clásico en ambos casos.
labels.setting.site.logo.url.label=URL de la imagen del logotipo
labels.setting.site.logo.url.description=El logotipo que se muestra en la barra superior del sitio, como una URL http o https. En blanco se muestra en su lugar el nombre de la organización como texto.
labels.setting.site.favicon.url.label=URL del favicon
labels.setting.site.favicon.url.description=El icono que los navegadores muestran en las pestañas del sitio, como una URL http o https. En blanco significa sin icono, así que el navegador muestra el suyo genérico.
labels.setting.site.ogImage.url.label=URL de la imagen de vista previa de enlaces
labels.setting.site.ogImage.url.description=La imagen que las aplicaciones de chat y las redes sociales muestran cuando alguien comparte un enlace al sitio, como una URL http o https. En blanco se usa el logotipo; si tampoco hay logotipo, los enlaces se previsualizan sin imagen.
labels.setting.site.background.url.label=URL de la imagen de fondo de página
labels.setting.site.background.url.description=Una imagen que se muestra detrás de las páginas del sitio, como una URL http o https. En blanco significa sin imagen de fondo, así que se ve el color de fondo de página.
labels.setting.site.background.color.label=Color de fondo de página
labels.setting.site.background.color.description=El color que se muestra detrás de las páginas del sitio cuando no hay imagen de fondo, como valor hexadecimal, por ejemplo #333333. En blanco significa el fondo propio de la paleta, un matiz de su color que sigue la elección de modo oscuro.
labels.setting.site.footer.title.label=Título del pie de página
labels.setting.site.footer.title.description=El encabezado del pie de página en el sitio de la organización. En blanco se muestra el nombre de la organización.
labels.setting.site.footer.title.color.label=Color del título del pie de página
labels.setting.site.footer.title.color.description=El color del título del pie de página, como valor hexadecimal, por ejemplo #ffffff. En blanco se usa el color de pie de página propio del tema, que sirve para ambos diseños.
labels.setting.site.footer.text.label=Texto del pie de página
labels.setting.site.footer.text.description=Una línea de texto sin formato bajo el título del pie de página, como un lema, una dirección postal o un número de registro. En blanco no se muestra nada ahí.
labels.setting.site.footer.text.color.label=Color del texto del pie de página
labels.setting.site.footer.text.color.description=El color de la línea de texto bajo el título del pie de página, como valor hexadecimal, por ejemplo #ffffff. En blanco se usa el color de pie de página propio del tema.
labels.setting.site.footer.links.color.label=Color de los enlaces del pie de página
labels.setting.site.footer.links.color.description=El color de los enlaces Privacidad, Términos y Soporte del pie de página y de los puntos entre ellos, como valor hexadecimal, por ejemplo #ffffff. En blanco se usa el color de enlaces de pie de página propio del tema.
labels.setting.site.contact.name.label=Nombre de contacto
labels.setting.site.contact.name.description=El nombre en la tarjeta de contacto de la barra lateral del sitio de la organización, junto al correo de contacto de su perfil. Nunca se hereda del sitio compartido: en blanco, el nombre no aparece. La tarjeta se oculta cuando el nombre, el teléfono y el correo están todos en blanco.
labels.setting.site.contact.phone.label=Teléfono de contacto
labels.setting.site.contact.phone.description=El número de teléfono en la tarjeta de contacto de la barra lateral del sitio de la organización, mostrado exactamente como se escribió. Nunca se hereda del sitio compartido: en blanco, el teléfono no aparece en la tarjeta.
labels.setting.site.donate.url.label=URL del enlace para donar
labels.setting.site.donate.url.description=La página http o https a la que llevan la tarjeta Donar y la entrada Donar del menú. Nunca se hereda del sitio compartido: en blanco significa que no se muestra ninguna de las dos.
labels.setting.site.donate.title.label=Encabezado de la tarjeta Donar
labels.setting.site.donate.title.description=El encabezado de la tarjeta Donar de la barra lateral, por ejemplo Haz una donación; la tarjeta solo aparece cuando hay una URL del enlace para donar. En blanco se muestra Donar.
labels.setting.site.donate.text.label=Texto de la tarjeta Donar
labels.setting.site.donate.text.description=Una línea breve de texto sin formato sobre el botón Donar, que dice a qué se destina una donación. En blanco se muestra solo el botón.
labels.setting.site.donate.paypalImage.label=Imagen Donar de PayPal
labels.setting.site.donate.paypalImage.description=Encendido: la tarjeta Donar muestra la imagen amarilla del botón Donar de PayPal en lugar de un botón con los colores del sitio. Se aplica solo cuando la URL del enlace para donar es una página de paypal.com; cualquier otro enlace conserva el botón con el tema del sitio.
labels.setting.site.title.label=Título del sitio
labels.setting.site.title.description=El título que los navegadores muestran en la pestaña y en los marcadores para el sitio de la organización, y el nombre del sitio cuando se instala en la pantalla de inicio de un teléfono. En blanco se usa el nombre de la organización.
labels.setting.site.sidebar.title.label=Encabezado de viajes en la barra lateral
labels.setting.site.sidebar.title.description=El encabezado sobre la lista de próximos viajes en la barra lateral del sitio de la organización, por ejemplo Retiros o Recorridos. En blanco se muestra Viajes.
labels.setting.site.mail.email.label=Correo del sitio
labels.setting.site.mail.email.description=La dirección propia del sitio: lo que 'Correo del sitio' significa en cada espacio de abajo, y la alternativa cuando una organización no tiene correo de contacto. Se usa como remitente, así que su dominio debe ser uno desde el que SES esté verificado para enviar.
labels.setting.reg.mail.from.label=Dirección del remitente
labels.setting.reg.mail.from.description=Correos de inscripción dirigidos a la persona inscrita (recibida/aprobada). Debe ser una dirección desde la que SES esté verificado para enviar, o todos los correos de inscripción fallan. Forma del valor: 'site' = el correo del sitio, 'org' = el correo de contacto de la organización propietaria (o, si no tiene, el correo del sitio), 'facilitators' = los correos de los facilitadores del viaje (solo en espacios con contexto de organización; con la misma alternativa que 'org'), cualquier otro valor = esa dirección tal cual.
labels.setting.reg.mail.replyTo.label=Dirección de respuesta
labels.setting.reg.mail.replyTo.description=Adónde llega la respuesta de una persona inscrita. Los correos invitan a hacer preguntas, así que debería ser un buzón que alguien lea. Forma del valor: 'site' = el correo del sitio, 'org' = el correo de contacto de la organización propietaria (o, si no tiene, el correo del sitio), 'facilitators' = los correos de los facilitadores del viaje (solo en espacios con contexto de organización; con la misma alternativa que 'org'), cualquier otro valor = esa dirección tal cual.
labels.setting.reg.notify.email.label=Destinatario del aviso de inscripción
labels.setting.reg.notify.email.description=Quién recibe los avisos internos de inscripción (nueva, movida, cancelada). De forma predeterminada son los coordinadores del viaje, los mismos contactos que se le muestran a la persona inscrita.
labels.setting.reg.notify.from.label=Remitente del aviso de inscripción
labels.setting.reg.notify.from.description=El remitente de los avisos internos de inscripción. Debe estar verificado en SES. Forma del valor: 'site' = el correo del sitio, 'org' = el correo de contacto de la organización propietaria (o, si no tiene, el correo del sitio), 'facilitators' = los correos de los facilitadores del viaje (solo en espacios con contexto de organización; con la misma alternativa que 'org'), cualquier otro valor = esa dirección tal cual.
labels.setting.account.notify.email.label=Destinatario del aviso de cuenta
labels.setting.account.notify.email.description=Quién recibe los avisos internos de cuenta nueva. Al crearse una cuenta todavía no existe ninguna organización, así que aquí no hay opción de organización. El valor predeterminado conserva la dirección que la página tenía fija antes. Forma del valor: 'site' = el correo del sitio, 'org' = el correo de contacto de la organización propietaria (o, si no tiene, el correo del sitio), 'facilitators' = los correos de los facilitadores del viaje (solo en espacios con contexto de organización; con la misma alternativa que 'org'), cualquier otro valor = esa dirección tal cual.
labels.setting.account.notify.from.label=Remitente del aviso de cuenta
labels.setting.account.notify.from.description=El remitente de los avisos internos de cuenta nueva. Debe estar verificado en SES. Forma del valor: 'site' = el correo del sitio, 'org' = el correo de contacto de la organización propietaria (o, si no tiene, el correo del sitio), 'facilitators' = los correos de los facilitadores del viaje (solo en espacios con contexto de organización; con la misma alternativa que 'org'), cualquier otro valor = esa dirección tal cual.
labels.setting.tx.notify.email.label=Destinatario del aviso de transacción
labels.setting.tx.notify.email.description=Quién recibe los avisos internos de transacción guardada. El valor predeterminado conserva la dirección que la página tenía fija antes. Forma del valor: 'site' = el correo del sitio, 'org' = el correo de contacto de la organización propietaria (o, si no tiene, el correo del sitio), 'facilitators' = los correos de los facilitadores del viaje (solo en espacios con contexto de organización; con la misma alternativa que 'org'), cualquier otro valor = esa dirección tal cual.
labels.setting.tx.notify.from.label=Remitente del aviso de transacción
labels.setting.tx.notify.from.description=El remitente de los avisos internos de transacción guardada. Debe estar verificado en SES. Forma del valor: 'site' = el correo del sitio, 'org' = el correo de contacto de la organización propietaria (o, si no tiene, el correo del sitio), 'facilitators' = los correos de los facilitadores del viaje (solo en espacios con contexto de organización; con la misma alternativa que 'org'), cualquier otro valor = esa dirección tal cual.
labels.setting.login.mail.from.label=Dirección del remitente
labels.setting.login.mail.from.description=El remitente del correo con el código de inicio de sesión. Debe ser una dirección desde la que SES esté verificado para enviar, o el correo con el código falla. Forma del valor: 'site' = el correo del sitio, 'org' = el correo de contacto de la organización propietaria (o, si no tiene, el correo del sitio), 'facilitators' = los correos de los facilitadores del viaje (solo en espacios con contexto de organización; con la misma alternativa que 'org'), cualquier otro valor = esa dirección tal cual.
labels.setting.login.mail.replyTo.label=Dirección de respuesta
labels.setting.login.mail.replyTo.description=Adónde va la respuesta a un correo con código de inicio de sesión. Quien se queda atascado en la página de inicio de sesión suele responder al correo que tiene delante, así que debería ser una dirección que lea una persona.
labels.setting.chat.mail.from.label=Dirección del remitente
labels.setting.chat.mail.from.description=El remitente del correo del chat. Debe ser una dirección desde la que SES esté verificado para enviar, o todos los correos del chat fallan. Forma del valor: 'site' = el correo del sitio, 'org' = el correo de contacto de la organización propietaria (o, si no tiene, el correo del sitio), 'facilitators' = los correos de los facilitadores del viaje (solo en espacios con contexto de organización; con la misma alternativa que 'org'), cualquier otro valor = esa dirección tal cual.
labels.setting.chat.mail.replyTo.label=Dirección de respuesta
labels.setting.chat.mail.replyTo.description=Adónde va una respuesta. El correo del chat no es una lista de correo, así que las respuestas no se entregan al chat. Forma del valor: 'site' = el correo del sitio, 'org' = el correo de contacto de la organización propietaria (o, si no tiene, el correo del sitio), 'facilitators' = los correos de los facilitadores del viaje (solo en espacios con contexto de organización; con la misma alternativa que 'org'), cualquier otro valor = esa dirección tal cual.
labels.setting.support.mail.from.label=Remitente de solicitudes de soporte
labels.setting.support.mail.from.description=El remitente del correo de solicitudes de soporte dirigido a los administradores del canal de soporte. Debe estar verificado en SES. Forma del valor: 'site' = el correo del sitio, 'org' = el correo de contacto de la organización propietaria (o, si no tiene, el correo del sitio), 'facilitators' = los correos de los facilitadores del viaje (solo en espacios con contexto de organización; con la misma alternativa que 'org'), cualquier otro valor = esa dirección tal cual.
labels.setting.support.mail.replyTo.label=Dirección de respuesta de solicitudes de soporte
labels.setting.support.mail.replyTo.description=Adónde va la respuesta a un correo de solicitud de soporte. Los destinatarios son los propios administradores del canal de soporte (definidos más abajo), así que esto rara vez importa. Forma del valor: 'site' = el correo del sitio, 'org' = el correo de contacto de la organización propietaria (o, si no tiene, el correo del sitio), 'facilitators' = los correos de los facilitadores del viaje (solo en espacios con contexto de organización; con la misma alternativa que 'org'), cualquier otro valor = esa dirección tal cual.
labels.setting.cache.near.ttlSeconds.label=TTL de la caché cercana (segundos)
labels.setting.cache.near.ttlSeconds.description=Límite superior absoluto del tiempo durante el cual la caché cercana dentro de la JVM puede servir una entrada. Las escrituras hechas por esta instancia y las invalidaciones difundidas (scripts, borrados de administración) actualizan la caché de inmediato, y la comprobación de estado de abajo hace converger todo lo demás, así que este límite solo importa si ambas fallan. 0 apaga la caché cercana. Los cambios se aplican al guardar; una propiedad de sistema -Dtrip.cache.near.ttlSeconds fija este valor por encima de la tabla de configuración.
labels.setting.cache.near.checkSeconds.label=Intervalo de comprobación de la caché cercana (segundos)
labels.setting.cache.near.checkSeconds.description=Cuando la caché cercana acierta con una entrada cuya última comprobación es más antigua que esto, UNA actualización en segundo plano vuelve a leer la caché compartida y actualiza la entrada; la solicitud misma nunca espera. Como la invalidación difundida cubre las escrituras deliberadas hechas por fuera, este es el límite de convergencia solo para las escrituras ordinarias desde OTRAS JVM (herramientas de línea de comandos con la caché activa, una segunda instancia) y para las difusiones perdidas.
labels.setting.push.enabled.label=Enviar notificaciones push
labels.setting.push.enabled.description=El interruptor general de todas las notificaciones push (APNs a la aplicación, Web Push a los navegadores): menciones y respuestas del chat, suscripciones a todos los mensajes de un canal, aprobaciones de inscripción, confirmaciones de pago, solicitudes de soporte, insignias y actualizaciones silenciosas. Apagado significa que no se envía ninguna, digan lo que digan las preferencias de cada persona. Requiere que el secreto de push (clave de APNs y par VAPID) esté desplegado antes.
labels.setting.push.apns.topic.label=Tema de APNs
labels.setting.push.apns.topic.description=El identificador de paquete de la aplicación, enviado como apns-topic. Apple rechaza un token registrado por una aplicación con otro identificador de paquete (DeviceTokenNotForTopic), y ese token se descarta.
labels.setting.push.silent.intervalMinutes.label=Intervalo de actualización silenciosa (minutos)
labels.setting.push.silent.intervalMinutes.description=Tras la actividad en un chat, los teléfonos que NO recibieron una alerta reciben como máximo una notificación de actualización en segundo plano cada esta cantidad de minutos, para que la insignia y los contadores de no leídos se mantengan al día sin abrir la aplicación. 0 apaga las actualizaciones silenciosas; el rango es de 0 a 240.
labels.setting.push.web.enabled.label=Push a navegadores (Web Push)
labels.setting.push.web.enabled.description=El interruptor propio de la ruta de navegadores, bajo el interruptor general de arriba: apagado significa que los navegadores suscritos no reciben nada mientras los teléfonos siguen funcionando.
labels.setting.profile.bgRemoval.enabled.label=Ofrecer eliminación del fondo
labels.setting.profile.bgRemoval.enabled.description=Agrega a las fotos de perfil la opción "reemplazar el fondo": un modelo de aprendizaje automático en el servidor (U^2-Net-small sobre ONNX Runtime) recorta a la persona y el color elegido rellena lo que queda detrás. Mientras se usa, el modelo ocupa unos cientos de MB de la memoria de la tarea; se libera tras 10 minutos sin uso (el siguiente uso vuelve a pagar cerca de 1 s de carga del modelo).
labels.setting.home.banner.enabled.label=Mostrar el aviso
labels.setting.home.banner.enabled.description=Muestra un aviso en la parte superior de la página de inicio pública. El aviso necesita además su texto, abajo.
labels.setting.home.banner.text.label=Texto del aviso
labels.setting.home.banner.text.description=El aviso en sí. En blanco, el aviso se oculta aunque Mostrar el aviso esté encendido.
labels.setting.home.photos.windowDays.label=Fotos de los últimos (días)
labels.setting.home.photos.windowDays.description=Cuántos días después de terminar un viaje sus fotos siguen en la página de inicio. Los álbumes de viajes más antiguos salen solos de la tira de fotos.
labels.setting.home.photos.minCount.label=Mínimo de fotos por viaje
labels.setting.home.photos.minCount.description=La menor cantidad de fotos mostradas públicamente que un viaje necesita para que su álbum aparezca en la página de inicio. Un viaje con menos queda fuera de la tira de fotos.
labels.setting.home.countdown.soonDays.label=Cuentas regresivas adicionales dentro de (días)
labels.setting.home.countdown.soonDays.description=La barra lateral siempre muestra la cuenta regresiva del próximo viaje en cada idioma; un viaje que empieza dentro de esta cantidad de días también recibe una cuenta regresiva, aunque esté detrás de otro viaje en el mismo idioma.
labels.setting.content.versions.retained.label=Versiones de contenido conservadas
labels.setting.content.versions.retained.description=Cuántas versiones anteriores de cada plantilla de contenido y de cada elemento de contenido de página se conservan para deshacer. Bajarlo recorta el historial la próxima vez que se guarde cada elemento.
labels.setting.chat.mail.enabled.label=Enviar correo del chat
labels.setting.chat.mail.enabled.description=El interruptor general de todo el correo del chat, incluidas las menciones y el resumen diario. Apagado significa que el chat no envía ningún correo, digan lo que digan las preferencias de cada persona.
labels.setting.chat.mail.baseUrl.label=Dirección del sitio en los enlaces
labels.setting.chat.mail.baseUrl.description=Se antepone a los enlaces del correo del chat. Si está mal, lleva a la gente al sitio equivocado, o a ninguna parte.
labels.setting.chat.digest.enabled.label=Enviar el resumen diario
labels.setting.chat.digest.enabled.description=Ejecuta el resumen que sale una vez al día. Cada persona tiene que suscribirse por su cuenta, y a nadie que no tenga novedades se le envía correo.
labels.setting.chat.digest.hour.label=Hora del día para enviar
labels.setting.chat.digest.hour.description=La hora del día, de 0 a 23, en la zona horaria de abajo. Los valores fuera de ese rango se ajustan al límite en lugar de rechazarse.
labels.setting.chat.digest.zone.label=Zona horaria
labels.setting.chat.digest.zone.description=Un id de zona IANA, por ejemplo America/Los_Angeles. Una zona no reconocida vuelve al valor predeterminado.
labels.setting.chat.global.limit.label=Mensajes por persona, todos los chats
labels.setting.chat.global.limit.description=El tope entre todos los chats en los que está una persona, además de los límites de ráfaga y sostenidos de cada chat. Subirlo no afloja los límites por chat.
labels.setting.chat.global.windowSeconds.label=...dentro de esta cantidad de segundos
labels.setting.chat.global.windowSeconds.description=El intervalo sobre el que se cuenta el límite de arriba. Cambiarlo inicia una cuenta nueva en lugar de reinterpretar la que está en curso.
labels.setting.chat.edit.windowMinutes.label=Plazo de edición del autor (minutos)
labels.setting.chat.edit.windowMinutes.description=Cuánto tiempo puede alguien corregir su propio mensaje. Corto a propósito: una edición reescribe lo que otros ya leyeron, así que esto es para arreglar una errata, no para reescribir la historia.
labels.setting.chat.autoMute.triggerCount.label=Veces que se alcanza un límite antes del silencio automático
labels.setting.chat.autoMute.triggerCount.description=Cuántas veces puede alguien alcanzar un límite antes de quedar silenciado automáticamente.
labels.setting.chat.autoMute.triggerWindowSeconds.label=...dentro de esta cantidad de segundos
labels.setting.chat.autoMute.triggerWindowSeconds.description=El intervalo sobre el que se cuentan esas veces.
labels.setting.chat.autoMute.ladderMinutes.label=Duraciones del silencio, en minutos
labels.setting.chat.autoMute.ladderMinutes.description=Separadas por comas y en aumento: el primer silencio automático usa el primer valor, el siguiente el segundo, y así sucesivamente, repitiéndose el último. Una lista mal formada vuelve al valor predeterminado.
labels.setting.chat.autoMute.tierDecayHours.label=La escalada se olvida después de (horas)
labels.setting.chat.autoMute.tierDecayHours.description=Cuánto tiempo de buen comportamiento hace falta para que alguien baje un peldaño en la escala de arriba.
labels.setting.chat.alarm.dedupeWindowSeconds.label=Registros de alarma: como máximo uno cada (segundos)
labels.setting.chat.alarm.dedupeWindowSeconds.description=Las alarmas de abuso van al registro de auditoría, que solo admite agregados y nunca caduca, así que se deduplican por persona y por chat dentro de este intervalo. Bajarlo permite que un script llene el registro.
labels.setting.chat.blockedTerms.label=Palabras bloqueadas
labels.setting.chat.blockedTerms.description=Separadas por comas. Un mensaje del chat o un comentario de foto que contenga una de ellas como palabra completa se rechaza con una explicación. No distingue mayúsculas de minúsculas. En blanco apaga el filtro; la moderación (denuncias, silencios, eliminaciones) sigue funcionando en ambos casos.
labels.setting.moderation.report.email.label=Destinatario de denuncias de contenido
labels.setting.moderation.report.email.description=A quién se le envía un correo cuando alguien denuncia un mensaje del chat, una foto o un comentario. Quien las recibe responde las denuncias en un plazo de 24 horas; los Términos de uso lo prometen. Forma del valor: 'site' = el correo del sitio, 'org' = el correo de contacto de la organización propietaria (o, si no tiene, el correo del sitio), 'facilitators' = los correos de los facilitadores del viaje (solo en espacios con contexto de organización; con la misma alternativa que 'org'), cualquier otro valor = esa dirección tal cual.
labels.setting.moderation.report.from.label=Remitente de denuncias de contenido
labels.setting.moderation.report.from.description=El remitente de los correos de denuncia de contenido. Debe estar verificado en SES. Forma del valor: 'site' = el correo del sitio, 'org' = el correo de contacto de la organización propietaria (o, si no tiene, el correo del sitio), 'facilitators' = los correos de los facilitadores del viaje (solo en espacios con contexto de organización; con la misma alternativa que 'org'), cualquier otro valor = esa dirección tal cual.
labels.setting.moderation.platform.email.label=Copia para la plataforma
labels.setting.moderation.platform.email.description=Aquí llega una copia oculta de cada denuncia de contenido y de cada aviso de eliminación de cuenta, para que el operador de la plataforma los vea sin importar lo que una organización haya definido. En blanco significa sin copia.
labels.setting.chat.reactions.palette.label=Emojis de reacción
labels.setting.chat.reactions.palette.description=Los emojis con los que se puede reaccionar, separados por comas, en el orden en que se ofrecen. Cada uno se compara de forma exacta, y las reacciones ya dadas con un emoji retirado se conservan pero dejan de ofrecerse.
labels.setting.chat.background.colors.label=Colores de fondo ofrecidos
labels.setting.chat.background.colors.description=Los colores que se pueden elegir para el fondo de un chat, separados por comas y ofrecidos en este orden. Una entrada que no sea un valor #rrggbb simple o un nombre de color CSS se descarta, porque el valor se escribe en los estilos de la página.
labels.setting.chat.background.image.label=Imagen de fondo predeterminada
labels.setting.chat.background.image.description=La imagen que se muestra atenuada detrás de los mensajes cuando ni el viaje ni la persona eligieron una, como una URL http o https. En blanco significa ninguna imagen.
labels.setting.chat.invites.enabled.label=Permitir enlaces de invitación
labels.setting.chat.invites.enabled.description=Permite que los participantes del chat inviten a personas que no están en el viaje, como familiares y amigos, mediante un enlace o un código QR. Apagado rechaza los enlaces nuevos Y ADEMÁS impide canjear los existentes; los invitados que ya están en un chat se quedan.
labels.setting.chat.invites.expiryDays.label=Duración del enlace de invitación (días)
labels.setting.chat.invites.expiryDays.description=Cuánto tiempo funciona un enlace de invitación nuevo. Diga lo que diga este valor, un enlace nunca dura más que el chat mismo: el vencimiento tiene como tope el momento en que el chat se archiva.
labels.setting.chat.invites.maxPerChannel.label=Enlaces vigentes por chat
labels.setting.chat.invites.maxPerChannel.description=Cuántos enlaces de invitación sin vencer puede tener un chat a la vez. Los enlaces vencidos y los revocados dejan de contar por sí solos.
labels.setting.chat.photoComments.enabled.label=Comentarios y reacciones en fotos
labels.setting.chat.photoComments.enabled.description=Hilos de comentarios y reacciones con emojis en cada foto del chat (visor de álbumes, vista ampliada del chat y la página pública de llegada). Apagarlo oculta el panel y rechaza publicaciones nuevas; los comentarios existentes se conservan.
labels.setting.chat.photoComments.maxChars.label=Longitud del comentario de foto
labels.setting.chat.photoComments.maxChars.description=La longitud máxima permitida de un comentario de foto, en caracteres. Más corto que un mensaje del chat a propósito: el panel junto a una foto es un espacio del tamaño de un pie de foto, no un segundo chat.
labels.setting.login.code.enabled.label=Ofrecer códigos de inicio de sesión por correo
labels.setting.login.code.enabled.description=Permite iniciar sesión con un código corto enviado por correo en lugar de la contraseña. También es el camino para una contraseña olvidada, así que apagarlo deja "pedir ayuda" como única forma de recuperación.
labels.setting.login.code.length.label=Longitud del código (dígitos)
labels.setting.login.code.length.description=Cuántos dígitos tiene un código de inicio de sesión. Más largo es más difícil de adivinar y más difícil de escribir; 6 coincide con lo que la gente ve en todas partes.
labels.setting.login.code.ttlSeconds.label=Vigencia del código (segundos)
labels.setting.login.code.ttlSeconds.description=Cuánto tiempo funciona un código después de enviarse. Una entrega lenta del correo consume parte de ese tiempo, así que ponerlo muy bajo sobre todo deja fuera a quienes tienen proveedores de correo lentos.
labels.setting.login.code.maxSends.label=Códigos enviados por persona
labels.setting.login.code.maxSends.description=Cuántos códigos se le pueden enviar a una dirección de correo dentro del intervalo de abajo. Un tope al volumen de correo, y a que se use la página de inicio de sesión para molestar el buzón de alguien.
labels.setting.login.code.sendWindowSeconds.label=...dentro de esta cantidad de segundos
labels.setting.login.code.sendWindowSeconds.description=El intervalo sobre el que se cuenta el tope de envíos. Cambiarlo inicia una cuenta nueva.
labels.setting.login.code.maxAttempts.label=Intentos por código
labels.setting.login.code.maxAttempts.description=Cuántos ingresos incorrectos invalidan un código. Con 6 dígitos y 5 intentos en 5 minutos, adivinar no es un ataque realista.
labels.setting.login.remember.enabled.label=Mantener la sesión iniciada
labels.setting.login.remember.enabled.description=Da a cada inicio de sesión que no sea de un administrador una cookie de navegador de larga duración que vuelve a iniciar la sesión sin avisar cuando esta termina. Apagado también deja de aceptar todas las cookies ya emitidas: es el interruptor de emergencia.
labels.setting.login.remember.days.label=...durante esta cantidad de días
labels.setting.login.remember.days.description=Cuánto dura la cookie que mantiene la sesión iniciada, contado desde el inicio de sesión (usarla no la prolonga). Cerrar la sesión o cambiar la contraseña la termina antes.
labels.setting.login.passkey.enabled.label=Ofrecer llaves de acceso
labels.setting.login.passkey.enabled.description=Permite agregar una llave de acceso (Face ID, huella digital o bloqueo del dispositivo) después de iniciar sesión, e iniciar sesión con ella en adelante. Nadie está obligado a crear una, y la página de inicio de sesión se ve igual para quien no la tiene. Conviene dejarlo APAGADO hasta verificar un registro e inicio de sesión completos contra la imagen desplegada; las llaves de acceso existentes sobreviven aunque el interruptor esté apagado.
labels.setting.login.password.maxFails.label=Contraseñas incorrectas por persona
labels.setting.login.password.maxFails.description=Después de esta cantidad de contraseñas incorrectas para una dirección de correo dentro del intervalo de abajo, el inicio de sesión para esa dirección se rechaza hasta que el intervalo se renueve. 0 apaga este freno.
labels.setting.login.password.failWindowSeconds.label=...dentro de esta cantidad de segundos
labels.setting.login.password.failWindowSeconds.description=El intervalo sobre el que se cuentan las contraseñas incorrectas. Cambiarlo inicia una cuenta nueva.
labels.setting.api.token.enabled.label=Tokens bearer de la API
labels.setting.api.token.enabled.description=Permite que los clientes nativos y móviles inicien sesión por la API REST con tokens bearer (docs/api-tokens.md). Apagado significa que no se emiten, no se renuevan Y TAMPOCO se aceptan los tokens ya emitidos: es el interruptor de emergencia. Conviene dejarlo APAGADO hasta que se publique un cliente.
labels.setting.api.token.access.minutes.label=...minutos del token de acceso
labels.setting.api.token.access.minutes.description=Cuánto tiempo funciona un token de acceso antes de que el cliente deba renovarlo en silencio. También limita lo desactualizado que puede estar el rol estampado en un token, así que más corto es más seguro.
labels.setting.api.token.refresh.days.label=...días del token de renovación
labels.setting.api.token.refresh.days.description=Cuánto tiempo un dispositivo con sesión iniciada la conserva sin volver a ingresar credenciales, contado desde el inicio de sesión (renovar no lo prolonga). Cerrar la sesión o un cambio de contraseña lo termina antes.
labels.setting.api.token.refresh.admin.days.label=...días de renovación de administradores
labels.setting.api.token.refresh.admin.days.description=La vigencia de renovación de los tokens con alcance de ADMINISTRADOR, más corta que la de un miembro: un token de administrador es la credencial más valiosa que este sistema entrega. Un mes evita que los administradores de la aplicación nativa inicien sesión cada semana; el valor tiene ese tope.
labels.setting.account.delete.requireSettled.label=Rechazar la eliminación con asuntos pendientes
labels.setting.account.delete.requireSettled.description=Encendido: una persona no puede eliminar su propia cuenta mientras esté inscrita en un viaje que no ha terminado o deba un saldo; la aplicación le indica a quién contactar. Apagado: la eliminación siempre procede (el correo de aviso igual muestra lo que se debe). El interruptor existe para poder relajar la regla sin un despliegue si la revisión de una tienda lo exige.
labels.setting.account.delete.notify.email.label=Destinatario del aviso de eliminación de cuenta
labels.setting.account.delete.notify.email.description=A quién se le informa cuando una persona elimina su cuenta: un aviso por cada organización a la que la persona pertenecía, cada uno con solo los viajes y el dinero de esa organización. Forma del valor: 'site' = el correo del sitio, 'org' = el correo de contacto de la organización propietaria (o, si no tiene, el correo del sitio), 'facilitators' = los correos de los facilitadores del viaje (solo en espacios con contexto de organización; con la misma alternativa que 'org'), cualquier otro valor = esa dirección tal cual.
labels.setting.account.delete.notify.from.label=Remitente del aviso de eliminación de cuenta
labels.setting.account.delete.notify.from.description=El remitente de los avisos de eliminación de cuenta. Debe estar verificado en SES. Forma del valor: 'site' = el correo del sitio, 'org' = el correo de contacto de la organización propietaria (o, si no tiene, el correo del sitio), 'facilitators' = los correos de los facilitadores del viaje (solo en espacios con contexto de organización; con la misma alternativa que 'org'), cualquier otro valor = esa dirección tal cual.
labels.setting.family.maxMembers.label=Límite de tamaño de la familia
labels.setting.family.maxMembers.description=Máximo de personas en una cuenta familiar, contando al titular. Al llegar al límite, la página de la familia deja de ofrecer Agregar y permite enviar una solicitud de soporte; cuando llegue una, se sube este valor aquí. Es una protección contra el abuso, no una regla de negocio.
labels.setting.reg.allowEdits.label=Las personas inscritas pueden editar sus respuestas
labels.setting.reg.allowEdits.description=Encendido: un viajero ya inscrito, pendiente o confirmado, todavía puede cambiar sus respuestas en la página de inscripción. Apagado: sus respuestas quedan en solo lectura; la inscripción en sí no se ve afectada.
labels.setting.trip.tags.label=Etiquetas de viaje
labels.setting.trip.tags.description=Las etiquetas que los editores pueden poner en un viaje, separadas por comas, en el orden en que el editor las ofrece. Todas las organizaciones usan esta única lista. Cambiar el nombre de una etiqueta en algo más que sus mayúsculas, o quitarla, la retira de todos los viajes que la tenían.
labels.setting.reminders.enabled.label=Enviar mensajes programados del viaje
labels.setting.reminders.enabled.description=Ejecuta el envío de mensajes de viaje que sale una vez al día. Un mensaje solo sale después de que un facilitador del viaje aprobó su redacción y su fecha, así que encender esto no envía nada por sí solo.
labels.setting.reminders.hour.label=Hora del día para enviar
labels.setting.reminders.hour.description=La hora del día, de 0 a 23, en la zona horaria de abajo. Los valores fuera de ese rango se ajustan al límite en lugar de rechazarse.
labels.setting.reminders.zone.label=Zona horaria
labels.setting.reminders.zone.description=Un id de zona IANA, por ejemplo America/Los_Angeles. También decide en qué día cae la fecha de envío de un mensaje. Una zona no reconocida vuelve al valor predeterminado.
labels.setting.reg.mail.baseUrl.label=URL base de los enlaces
labels.setting.reg.mail.baseUrl.description=Se antepone a los enlaces al viaje y al perfil dentro de los correos de inscripción.
labels.setting.support.mail.enabled.label=Enviar por correo las solicitudes de soporte a los administradores del canal
labels.setting.support.mail.enabled.description=Una solicitud de soporte (quitar a alguien de una familia, aumentar el límite de tamaño) se publica en el canal de soporte en cualquier caso; esto controla si además se les envía un correo a los administradores del canal. A propósito NO depende del interruptor general del correo del chat: una solicitud de soporte no debe perderse en silencio porque el correo del chat esté apagado.
labels.setting.apps.appStore.url.label=URL de la ficha en App Store
labels.setting.apps.appStore.url.description=La página de la aplicación UniteTrip para iOS en App Store, que empieza con https://apps.apple.com/. La página de soporte muestra una insignia Download on the App Store que enlaza aquí; en blanco, la insignia no aparece.
labels.setting.apps.playStore.url.label=URL de la ficha en Google Play
labels.setting.apps.playStore.url.description=La página de la aplicación UniteTrip para Android en Google Play, que empieza con https://play.google.com/store/apps/details?id=. La página de soporte muestra una insignia Get it on Google Play que enlaza aquí; en blanco, la insignia no aparece, y así queda hasta que la ficha en Play esté publicada.
labels.setting.discover.rate.limit.label=Solicitudes de Descubrir por dirección
labels.setting.discover.rate.limit.description=Cuántas solicitudes de Descubrir (la lista y la búsqueda de viajes de las aplicaciones sin iniciar sesión) puede hacer una dirección de red dentro del intervalo de abajo antes de que se le pida ir más despacio. Generoso a propósito: toda una operadora móvil o una oficina puede compartir una sola dirección.
labels.setting.discover.rate.windowSeconds.label=...dentro de esta cantidad de segundos
labels.setting.discover.rate.windowSeconds.description=El intervalo sobre el que se cuenta el límite de arriba. Cambiarlo inicia una cuenta nueva en lugar de reinterpretar la que está en curso.
labels.setting.finance.treasurer.email.label=Correo del tesorero
labels.setting.finance.treasurer.email.description=La dirección a la que se envía por correo un informe de gastos de viaje presentado, como PDF con sus recibos, cuando quien lo presenta así lo elige. En blanco significa que no se conoce ningún tesorero, y el cuadro de diálogo Presentar lo dice.
labels.setting.lodging.bills.autoRecompute.label=Recalcular automáticamente los cargos de alojamiento
labels.setting.lodging.bills.autoRecompute.description=Encendido: cada cambio en una reserva, desde las fechas y las habitaciones hasta una cancelación, recalcula de inmediato los cargos de alojamiento de la habitación afectada. Apagado: el libro contable queda como está hasta que alguien presione Recalcular en la página Alojamiento del viaje.
labels.setting.payment.notify.email.label=Destinatario de la notificación de pago
labels.setting.payment.notify.email.description=La dirección que recibe una copia interna de cada correo de pago: las confirmaciones y el aviso de que un pago bancario no se pudo completar. Los pagos de una organización solo copian la dirección de su propia configuración; en blanco allí significa ninguna copia. La dirección de la configuración del sitio solo sirve para pagos sin organización.
labels.setting.payment.mail.from.label=Dirección del remitente de la confirmación de pago
labels.setting.payment.mail.from.description=Remitente alternativo para todo el sitio del correo de confirmación de pago, por ejemplo Nombre del Sitio <no-reply@site.org>. La configuración de pagos del viaje, y luego los valores predeterminados de la organización, tienen prioridad cuando existen. Debe estar en un dominio de envío verificado y compartido, porque sale en nombre de todas las organizaciones.
labels.setting.payment.confirm.templateId.label=Plantilla de confirmación de pago
labels.setting.payment.confirm.templateId.description=La plantilla de contenido de tipo MAIL que se usa para las confirmaciones de pago cuando ni el viaje ni su organización eligen una. La instala install-starter-templates.sh.
labels.setting.payment.fees.paidBy.label=Quién paga las comisiones del procesador
labels.setting.payment.fees.paidBy.description=ORGANIZATION o PAYER; el peldaño más bajo de la escalera viaje/organización/sitio. PAYER suma al cobro la comisión de la parte del viaje; ORGANIZATION la absorbe. La parte de la comisión que corresponde a una donación siempre la absorbe la organización, en ambos casos.
labels.setting.payment.returnUrl.allowedPrefixes.label=Direcciones de retorno de pago permitidas
labels.setting.payment.returnUrl.allowedPrefixes.description=Separadas por comas. Una aplicación móvil indica su propia dirección de retorno y de cancelación para un pago con PayPal, y se rechaza todo lo que no empiece con una de estas. Sin esta comprobación, el punto de entrada de pagos es una redirección abierta: un atacante se vale de nuestro flujo de PayPal para hacer que su propia página parezca parte de este sitio. El esquema propio de una aplicación, por ejemplo trip://, se agrega aquí antes de publicarla, no después.
