# --- Settings page sections: labels.settingSection.{id}.title and, where the section has a caveat, .note ---
labels.settingSection.site.title=Site
labels.settingSection.branding.title=Branding
labels.settingSection.branding.note=The look of an ORGANIZATION's own site, set by the organization on its Appearance page. An org site never inherits the shared site's look, and the shared site's own logo, footer and contacts are fixed in its pages -- so a value here on the site Settings page applies to nothing.
labels.settingSection.emailAddresses.title=Email addresses
labels.settingSection.emailAddresses.note=Every address the application sends with or to. From addresses must be on an SES-verified domain; recipients and Reply-To may be any address.
labels.settingSection.performance.title=Performance
labels.settingSection.performance.note=The in-JVM near-cache in front of the shared Valkey cache. Only reads whose call site declared Cached.YES (public/render paths) are served from it; auth, payments and editors always bypass it.
labels.settingSection.pushNotifications.title=Push notifications
labels.settingSection.pushNotifications.note=Ships dark: "Send push notifications" is the master switch and every route, badge and silent refresh sits under it. Each person still has their own switch, quiet hours and per-chat choice.
labels.settingSection.profilePictures.title=Profile pictures
labels.settingSection.homePage.title=Home page
labels.settingSection.contentTemplates.title=Content templates
labels.settingSection.chatEmail.title=Chat email
labels.settingSection.chatEmail.note=Nothing here sends mail on its own. "Send chat email" is the master switch; with it off the rest is inert.
labels.settingSection.chatDailyDigest.title=Chat daily digest
labels.settingSection.chatLimits.title=Chat limits
labels.settingSection.chatLimits.note=Per-chat burst and sustained limits live on each trip's own Chat settings page. These are the site-wide ones.
labels.settingSection.chatModeration.title=Chat moderation
labels.settingSection.chatModeration.note=Reports from the app go to the report recipient below and are answered within 24 hours.
labels.settingSection.chatAppearance.title=Chat appearance
labels.settingSection.chatInvites.title=Chat invites
labels.settingSection.chatInvites.note=Invite links admit people with an account who are not on the trip (family, friends) as chat guests. Guests can be removed like anyone else.
labels.settingSection.photoComments.title=Photo comments
labels.settingSection.photoComments.note=Comment threads and reactions on individual chat photos. Mention email from photo comments rides the chat-email master switch above.
labels.settingSection.loginSecurity.title=Login & security
labels.settingSection.loginSecurity.note=Email login codes double as the forgot-password flow. The mail addresses here are used for those codes.
labels.settingSection.accountDeletion.title=Account deletion
labels.settingSection.accountDeletion.note=Self-service deletion from the native app: the login, profile and content go; registration and money records stay under an anonymized record.
labels.settingSection.familyAccounts.title=Family accounts
labels.settingSection.registration.title=Registration
labels.settingSection.trips.title=Trips
labels.settingSection.scheduledTripMessages.title=Scheduled trip messages
labels.settingSection.scheduledTripMessages.note=Each trip's messages are written and approved on its Communications page (Reports tab). Nothing here sends mail on its own.
labels.settingSection.registrationEmail.title=Registration email
labels.settingSection.registrationEmail.note=The registrant-facing emails themselves are runtime-editable MAIL templates on the Templates page (registration-received / registration-approved).
labels.settingSection.supportRequests.title=Support requests
labels.settingSection.supportRequests.note=Who receives them is managed in the "Support channel admins" panel below the settings.
labels.settingSection.mobileApps.title=Mobile apps
labels.settingSection.mobileApps.note=Store links for the "Get the app" badges on the support page. Set each one when that listing goes live; nothing else reads them.
labels.settingSection.discover.title=Discover
labels.settingSection.discover.note=The apps' signed-out trip list and search, open to anyone. What it lists is decided by each trip's "Show on homepage" and its organization's "Shared sites" checkbox, not here; these only limit how fast one address may ask.
labels.settingSection.finance.title=Finance
labels.settingSection.finance.note=The trip budget and expense report. An organization sets its own treasurer on its Configuration page; the value here applies to organizations that have not.
labels.settingSection.lodging.title=Lodging
labels.settingSection.lodging.note=Hotels, lodging options and room assignments. An organization that reconciles lodging bills by hand can turn the automatic recompute off for its own trips.
labels.settingSection.payments.title=Payments
labels.settingSection.payments.note=The mail/fee settings are the SITE rung of the trip → organization → site defaults ladder. The return-address allowlist only applies to payments started through the API; the web checkout derives its return address from the page the payer was on and never consults it.

# --- settings: labels.setting.{setting name}.label and .description (config/KnownSettings; the description is the help-card text) ---
labels.setting.site.org.name.label=Organization name
labels.setting.site.org.name.description=The shared site's organization name, used on its public pages and in notices such as the photo-upload license text. An organization's own site shows the organization's name from its profile instead.
labels.setting.site.orgsites.baseDomain.label=Org sites base domain
labels.setting.site.orgsites.baseDomain.description=The domain organization sites live under: an org with slug 'acme' serves at acme.<this domain>. Its apex and www are the marketing site. Changing this only works when DNS and the certificate already cover the new domain's wildcard.
labels.setting.mail.sharedDomains.label=Shared sending domains
labels.setting.mail.sharedDomains.description=The verified sending domains every organization may send from, comma-separated. Any other verified domain is the custom domain of exactly one organization and only it may send from that domain. The site's own From addresses use these domains only.
labels.setting.site.analytics.id.label=Analytics property id
labels.setting.site.analytics.id.description=The web analytics property this site reports visits to: a Google Analytics 4 measurement id, which starts with G-. Blank means no analytics tag and no cookie banner. An organization's site never inherits the shared site's id: it reports only to an id the organization set for itself.
labels.setting.site.languages.label=Languages offered
labels.setting.site.languages.description=The languages visitors can choose, as comma-separated codes: en for English, es for Spanish, hr for Croatian. The first one is the default for a visitor whose own language is not offered. A code the site does not know is ignored, and an empty list means English.
labels.setting.api.languages.minAppVersion.label=First app version with languages
labels.setting.api.languages.minAppVersion.description=The oldest UniteTrip app version that is answered in the phone's language, such as 1.3.0. Older versions, and every version while this is blank, get the site's default language, because their own screens are English only.
labels.setting.site.theme.palette.label=Color palette
labels.setting.site.theme.palette.description=The accent color of the organization's site, used for its menus, buttons and links in both light and dark mode. Blank means the platform's default look.
labels.setting.site.theme.dark.label=Dark mode
labels.setting.site.theme.dark.description=On: the organization's site is drawn in its palette's dark theme, with a dark page background, top bar and menu. Off: the light theme. A visitor who picked light or dark for themselves keeps their own choice.
labels.setting.site.layout.label=Page layout
labels.setting.site.layout.description=How the site's home page is laid out: classic keeps the content card beside the sidebar, and full-width lets band sections such as a hero span the whole window. Blank means classic. Other pages keep the classic layout either way.
labels.setting.site.logo.url.label=Logo image URL
labels.setting.site.logo.url.description=The logo shown in the site's top bar, as an http or https URL. Blank shows the organization's name as text instead.
labels.setting.site.favicon.url.label=Favicon URL
labels.setting.site.favicon.url.description=The icon browsers show on the site's tabs, as an http or https URL. Blank means no icon, so the browser shows its generic one.
labels.setting.site.ogImage.url.label=Link preview image URL
labels.setting.site.ogImage.url.description=The picture chat apps and social sites show when someone shares a link to the site, as an http or https URL. Blank uses the logo; with no logo either, links preview without a picture.
labels.setting.site.background.url.label=Page background image URL
labels.setting.site.background.url.description=An image shown behind the site's pages, as an http or https URL. Blank means no background image, so the page background color shows instead.
labels.setting.site.background.color.label=Page background color
labels.setting.site.background.color.description=The color shown behind the site's pages when no background image is set, as a hex value, for example #333333. Blank means the palette's own background, a tint of its color that follows the dark mode choice.
labels.setting.site.footer.title.label=Footer title
labels.setting.site.footer.title.description=The heading of the page footer on the organization's site. Blank shows the organization's name.
labels.setting.site.footer.title.color.label=Footer title color
labels.setting.site.footer.title.color.description=The color of the footer title, as a hex value, for example #ffffff. Blank uses the theme's own footer color, which suits both layouts.
labels.setting.site.footer.text.label=Footer text
labels.setting.site.footer.text.description=A line of plain text under the footer title, such as a tagline, a mailing address or a registration number. Blank shows nothing there.
labels.setting.site.footer.text.color.label=Footer text color
labels.setting.site.footer.text.color.description=The color of the line of text under the footer title, as a hex value, for example #ffffff. Blank uses the theme's own footer color.
labels.setting.site.footer.links.color.label=Footer links color
labels.setting.site.footer.links.color.description=The color of the footer's Privacy, Terms and Support links and the dots between them, as a hex value, for example #ffffff. Blank uses the theme's own footer link color.
labels.setting.site.contact.name.label=Contact name
labels.setting.site.contact.name.description=The name on the contact card in the sidebar of the organization's site, beside the contact email from its profile. Never inherited from the shared site: blank leaves the name off. The card is hidden when the name, phone and email are all blank.
labels.setting.site.contact.phone.label=Contact phone
labels.setting.site.contact.phone.description=The phone number on the contact card in the sidebar of the organization's site, shown exactly as typed. Never inherited from the shared site: blank leaves the phone off the card.
labels.setting.site.donate.url.label=Donate link URL
labels.setting.site.donate.url.description=The http or https page the Donate card and the Donate menu entry send people to. Never inherited from the shared site: blank means neither is shown.
labels.setting.site.donate.title.label=Donate card heading
labels.setting.site.donate.title.description=The heading of the Donate card in the sidebar, which shows only when a donate link URL is set, for example Make a Donation. Blank shows Donate.
labels.setting.site.donate.text.label=Donate card text
labels.setting.site.donate.text.description=A short line of plain text above the Donate button, saying what a gift supports. Blank shows the button alone.
labels.setting.site.donate.paypalImage.label=PayPal Donate image
labels.setting.site.donate.paypalImage.description=On: the Donate card shows PayPal's own yellow Donate button image instead of a button in the site's colors. It applies only when the donate link URL is a paypal.com page; any other link keeps the themed button.
labels.setting.site.title.label=Site title
labels.setting.site.title.description=The title browsers show in the tab and bookmarks for the organization's site, and the name of the site when installed on a phone's home screen. Blank uses the organization's name.
labels.setting.site.sidebar.title.label=Sidebar trips heading
labels.setting.site.sidebar.title.description=The heading over the list of upcoming trips in the sidebar of the organization's site, for example Retreats or Tours. Blank shows Trips.
labels.setting.site.mail.email.label=Site email
labels.setting.site.mail.email.description=The site's own address: what 'Site email' means for every slot below, and the fallback when an organization has no contact email. Used as a From, so its domain must be one SES is verified to send from.
labels.setting.reg.mail.from.label=From address
labels.setting.reg.mail.from.description=Registrant-facing registration emails (received/approved). Must be an address SES is verified to send from, or every registration email fails. Value shape: 'site' = the Site email, 'org' = the owning organization's contact email (falling back to the Site email), 'facilitators' = the trip's facilitators' emails (org-context slots only; falls back like 'org'), anything else = that literal address.
labels.setting.reg.mail.replyTo.label=Reply-To address
labels.setting.reg.mail.replyTo.description=Where a registrant's reply lands. The emails invite questions, so this should be a mailbox somebody reads. Value shape: 'site' = the Site email, 'org' = the owning organization's contact email (falling back to the Site email), 'facilitators' = the trip's facilitators' emails (org-context slots only; falls back like 'org'), anything else = that literal address.
labels.setting.reg.notify.email.label=Registration notice recipient
labels.setting.reg.notify.email.description=Who receives the internal registration notices (new, moved, canceled). Defaults to the trip's coordinators, the same contacts the registrant is shown.
labels.setting.reg.notify.from.label=Registration notice From
labels.setting.reg.notify.from.description=The From on the internal registration notices. Must be SES-verified. Value shape: 'site' = the Site email, 'org' = the owning organization's contact email (falling back to the Site email), 'facilitators' = the trip's facilitators' emails (org-context slots only; falls back like 'org'), anything else = that literal address.
labels.setting.account.notify.email.label=Account notice recipient
labels.setting.account.notify.email.description=Who receives the internal new-account notices. No organization exists at account creation, so there is no org option here. The default preserves the address the page used to hardcode. Value shape: 'site' = the Site email, 'org' = the owning organization's contact email (falling back to the Site email), 'facilitators' = the trip's facilitators' emails (org-context slots only; falls back like 'org'), anything else = that literal address.
labels.setting.account.notify.from.label=Account notice From
labels.setting.account.notify.from.description=The From on the internal new-account notices. Must be SES-verified. Value shape: 'site' = the Site email, 'org' = the owning organization's contact email (falling back to the Site email), 'facilitators' = the trip's facilitators' emails (org-context slots only; falls back like 'org'), anything else = that literal address.
labels.setting.tx.notify.email.label=Transaction notice recipient
labels.setting.tx.notify.email.description=Who receives the internal transaction-saved notices. The default preserves the address the page used to hardcode. Value shape: 'site' = the Site email, 'org' = the owning organization's contact email (falling back to the Site email), 'facilitators' = the trip's facilitators' emails (org-context slots only; falls back like 'org'), anything else = that literal address.
labels.setting.tx.notify.from.label=Transaction notice From
labels.setting.tx.notify.from.description=The From on the internal transaction-saved notices. Must be SES-verified. Value shape: 'site' = the Site email, 'org' = the owning organization's contact email (falling back to the Site email), 'facilitators' = the trip's facilitators' emails (org-context slots only; falls back like 'org'), anything else = that literal address.
labels.setting.login.mail.from.label=From address
labels.setting.login.mail.from.description=Login-code email's From. Must be an address SES is verified to send from, or login-code email fails. Value shape: 'site' = the Site email, 'org' = the owning organization's contact email (falling back to the Site email), 'facilitators' = the trip's facilitators' emails (org-context slots only; falls back like 'org'), anything else = that literal address.
labels.setting.login.mail.replyTo.label=Reply-to address
labels.setting.login.mail.replyTo.description=Where a reply to a login-code email goes. Someone stuck at the login page tends to reply to the mail in front of them, so this should be an address a human reads.
labels.setting.chat.mail.from.label=From address
labels.setting.chat.mail.from.description=Chat email's From. Must be an address SES is verified to send from, or every chat email fails. Value shape: 'site' = the Site email, 'org' = the owning organization's contact email (falling back to the Site email), 'facilitators' = the trip's facilitators' emails (org-context slots only; falls back like 'org'), anything else = that literal address.
labels.setting.chat.mail.replyTo.label=Reply-to address
labels.setting.chat.mail.replyTo.description=Where a reply goes. Chat email is not a mailing list, so replies are not delivered to the chat. Value shape: 'site' = the Site email, 'org' = the owning organization's contact email (falling back to the Site email), 'facilitators' = the trip's facilitators' emails (org-context slots only; falls back like 'org'), anything else = that literal address.
labels.setting.support.mail.from.label=Support request From
labels.setting.support.mail.from.description=The From on support-request email to the support channel admins. Must be SES-verified. Value shape: 'site' = the Site email, 'org' = the owning organization's contact email (falling back to the Site email), 'facilitators' = the trip's facilitators' emails (org-context slots only; falls back like 'org'), anything else = that literal address.
labels.setting.support.mail.replyTo.label=Support request Reply-To
labels.setting.support.mail.replyTo.description=Where a reply to a support-request email goes. The recipients are the support channel admins themselves (configured below), so this is rarely load-bearing. Value shape: 'site' = the Site email, 'org' = the owning organization's contact email (falling back to the Site email), 'facilitators' = the trip's facilitators' emails (org-context slots only; falls back like 'org'), anything else = that literal address.
labels.setting.cache.near.ttlSeconds.label=Near-cache TTL (seconds)
labels.setting.cache.near.ttlSeconds.description=Absolute upper bound on how long the in-JVM near-cache may serve an entry. Writes through this instance and broadcast invalidations (scripts, admin clears) update the cache immediately, and the health check below converges everything else, so this bound only matters if both fail. 0 turns the near-cache off. Changes apply on save; a -Dtrip.cache.near.ttlSeconds sysprop pins this against the settings table entirely.
labels.setting.cache.near.checkSeconds.label=Near-cache health-check interval (seconds)
labels.setting.cache.near.checkSeconds.description=On a near-cache hit whose last check is older than this, ONE background refresh re-reads the shared cache and updates the entry; the request itself never waits. Since broadcast invalidation covers deliberate out-of-band writes, this is the convergence bound only for ordinary writes from OTHER JVMs (CLI tools with the cache configured, a second instance) and for missed broadcasts.
labels.setting.push.enabled.label=Send push notifications
labels.setting.push.enabled.description=The master switch for every push notification (APNs to the app, Web Push to browsers): chat mentions and replies, per-channel every-message opt-ins, registration approvals, payment confirmations, support requests, badges and silent refreshes. Off means nothing is pushed, whatever anyone's own preferences say. Needs the push secret (APNs key + VAPID pair) to be deployed first.
labels.setting.push.apns.topic.label=APNs topic
labels.setting.push.apns.topic.description=The app's bundle id, sent as apns-topic. A token registered by an app with another bundle id is refused by Apple (DeviceTokenNotForTopic) and pruned.
labels.setting.push.silent.intervalMinutes.label=Silent refresh interval (minutes)
labels.setting.push.silent.intervalMinutes.description=After chat activity, phones that were NOT alerted get at most one background refresh push per this many minutes, so badge and unread counts stay fresh without opening the app. 0 turns silent refreshes off; the range is 0 to 240.
labels.setting.push.web.enabled.label=Push to browsers (Web Push)
labels.setting.push.web.enabled.description=The browser route's own switch under the master switch above: off means subscribed browsers receive nothing while phones keep working.
labels.setting.profile.bgRemoval.enabled.label=Offer background removal
labels.setting.profile.bgRemoval.enabled.description=Adds a "replace background" option to profile pictures: an on-server ML model (U^2-Net-small via ONNX Runtime) cuts out the person and the chosen color fills in behind them. While in use the model holds a few hundred MB of task memory; it is released again after 10 idle minutes (the next use re-pays a ~1s model load).
labels.setting.home.banner.enabled.label=Show the banner
labels.setting.home.banner.enabled.description=Shows a notice at the top of the public home page. The banner also needs its text, below.
labels.setting.home.banner.text.label=Banner text
labels.setting.home.banner.text.description=The notice itself. Blank hides the banner even when Show the banner is on.
labels.setting.home.photos.windowDays.label=Pictures from the last (days)
labels.setting.home.photos.windowDays.description=How many days after a trip ends its photos stay on the home page. Older trips' albums drop off the photo strip on their own.
labels.setting.home.photos.minCount.label=Minimum pictures per trip
labels.setting.home.photos.minCount.description=The fewest publicly shown photos a trip needs before its album appears on the home page. A trip with fewer stays off the photo strip.
labels.setting.home.countdown.soonDays.label=Extra countdowns within (days)
labels.setting.home.countdown.soonDays.description=The sidebar always counts down to the next trip in each language; a trip starting within this many days gets a countdown too, even behind another trip in the same language.
labels.setting.content.versions.retained.label=Content versions kept
labels.setting.content.versions.retained.description=How many previous versions of each content template and each page-content item are kept for undo. Lowering it trims history on the next save of each item.
labels.setting.chat.mail.enabled.label=Send chat email
labels.setting.chat.mail.enabled.description=The master switch for every chat email, including mentions and the daily digest. Off means chat sends no mail at all, whatever anyone's own preferences say.
labels.setting.chat.mail.baseUrl.label=Site address in links
labels.setting.chat.mail.baseUrl.description=Prefixes the links in chat email. Getting this wrong sends people to the wrong site, or nowhere.
labels.setting.chat.digest.enabled.label=Send the daily digest
labels.setting.chat.digest.enabled.description=Runs the once-a-day summary. Each person still has to opt in for themselves, and nobody with nothing new is emailed.
labels.setting.chat.digest.hour.label=Hour of day to send
labels.setting.chat.digest.hour.description=The hour of the day, 0 to 23, in the time zone below. Values outside that range are clamped rather than refused.
labels.setting.chat.digest.zone.label=Timezone
labels.setting.chat.digest.zone.description=An IANA zone id, such as America/Los_Angeles. An unrecognized zone falls back to the default.
labels.setting.chat.global.limit.label=Messages per person, all chats
labels.setting.chat.global.limit.description=The ceiling across every chat a person is in, on top of each chat's own burst and sustained limits. Raising it does not loosen the per-chat limits.
labels.setting.chat.global.windowSeconds.label=...within this many seconds
labels.setting.chat.global.windowSeconds.description=The window the limit above is counted over. Changing it starts a fresh count rather than reinterpreting the one in progress.
labels.setting.chat.edit.windowMinutes.label=Author edit window (minutes)
labels.setting.chat.edit.windowMinutes.description=How long someone may correct their own message. Short on purpose: an edit rewrites what others have already read, so this is for fixing a typo, not revising history.
labels.setting.chat.autoMute.triggerCount.label=Rate-limit hits before an automatic mute
labels.setting.chat.autoMute.triggerCount.description=How many times someone may hit a limit before being muted automatically.
labels.setting.chat.autoMute.triggerWindowSeconds.label=...within this many seconds
labels.setting.chat.autoMute.triggerWindowSeconds.description=The window those hits are counted over.
labels.setting.chat.autoMute.ladderMinutes.label=Mute lengths, in minutes
labels.setting.chat.autoMute.ladderMinutes.description=Comma-separated and escalating: the first automatic mute uses the first value, the next the second, and so on, with the last repeating. A malformed list falls back to the default.
labels.setting.chat.autoMute.tierDecayHours.label=Escalation forgotten after (hours)
labels.setting.chat.autoMute.tierDecayHours.description=How long good behavior takes to drop someone back down the ladder above.
labels.setting.chat.alarm.dedupeWindowSeconds.label=Alarm records at most one per (seconds)
labels.setting.chat.alarm.dedupeWindowSeconds.description=Abuse alarms go to the audit trail, which is append-only and never expires, so they are deduped per person per chat over this window. Lowering it lets a script fill the trail.
labels.setting.chat.blockedTerms.label=Blocked words
labels.setting.chat.blockedTerms.description=Comma-separated. A chat message or photo comment containing one of these as a whole word is refused with an explanation. Case-insensitive. Blank turns the filter off; moderation (reports, mutes, removals) keeps working either way.
labels.setting.moderation.report.email.label=Content report recipient
labels.setting.moderation.report.email.description=Who is emailed when someone reports a chat message, photo or comment. Reports are answered within 24 hours by whoever receives them; the Terms of Use promise that. Value shape: 'site' = the Site email, 'org' = the owning organization's contact email (falling back to the Site email), 'facilitators' = the trip's facilitators' emails (org-context slots only; falls back like 'org'), anything else = that literal address.
labels.setting.moderation.report.from.label=Content report From
labels.setting.moderation.report.from.description=The From on content-report emails. Must be SES-verified. Value shape: 'site' = the Site email, 'org' = the owning organization's contact email (falling back to the Site email), 'facilitators' = the trip's facilitators' emails (org-context slots only; falls back like 'org'), anything else = that literal address.
labels.setting.moderation.platform.email.label=Platform copy
labels.setting.moderation.platform.email.description=A blind copy of every content report and account-deletion notice goes here, so the platform operator sees them whatever an organization has configured. Blank means no copy.
labels.setting.chat.reactions.palette.label=Reaction emoji
labels.setting.chat.reactions.palette.description=The emoji people may react with, separated by commas, in the order they are offered. Each is matched exactly, and reactions already given with a removed emoji are kept but no longer offered.
labels.setting.chat.background.colors.label=Background colors offered
labels.setting.chat.background.colors.description=The colors people may pick for a chat's background, separated by commas and offered in this order. An entry that is not a plain #rrggbb value or a CSS color name is dropped, since the value is written into the page's styles.
labels.setting.chat.background.image.label=Default background image
labels.setting.chat.background.image.description=The picture shown faded behind the messages when neither the trip nor the person has chosen one, as an http or https URL. Blank means no image at all.
labels.setting.chat.invites.enabled.label=Allow invite links
labels.setting.chat.invites.enabled.description=Lets chat participants invite people who are not on the trip, such as family and friends, by link or QR code. Off refuses new links AND stops existing ones from being redeemed; guests already in a chat stay.
labels.setting.chat.invites.expiryDays.label=Invite link lifetime (days)
labels.setting.chat.invites.expiryDays.description=How long a new invite link works. Whatever this says, a link never outlives the chat itself: expiry is capped at the chat's own archive time.
labels.setting.chat.invites.maxPerChannel.label=Outstanding links per chat
labels.setting.chat.invites.maxPerChannel.description=How many unexpired invite links one chat may have at once. Expired and revoked links stop counting on their own.
labels.setting.chat.photoComments.enabled.label=Photo comments and reactions
labels.setting.chat.photoComments.enabled.description=Comment threads and emoji reactions on individual chat photos (album viewer, chat lightbox and the public landing page). Turning this off hides the panel and refuses new posts; existing comments are kept.
labels.setting.chat.photoComments.maxChars.label=Photo comment length
labels.setting.chat.photoComments.maxChars.description=Longest allowed photo comment, in characters. Shorter than a chat message on purpose: the panel beside a photo is a caption-sized space, not a second chat.
labels.setting.login.code.enabled.label=Offer email login codes
labels.setting.login.code.enabled.description=Lets people sign in with a short code emailed to them instead of their password. This is also the forgot-password path, so turning it off leaves "ask for help" as the only recovery.
labels.setting.login.code.length.label=Code length (digits)
labels.setting.login.code.length.description=How many digits a login code has. Longer is harder to guess and harder to type; 6 matches what people see everywhere else.
labels.setting.login.code.ttlSeconds.label=Code lifetime (seconds)
labels.setting.login.code.ttlSeconds.description=How long a code works after it is sent. Slow email delivery eats into this, so setting it very low mostly locks out people with slow mail providers.
labels.setting.login.code.maxSends.label=Codes sent per person
labels.setting.login.code.maxSends.description=How many codes one email address can be sent within the window below. A cap on mail volume, and on using the login page to pester somebody's inbox.
labels.setting.login.code.sendWindowSeconds.label=...within this many seconds
labels.setting.login.code.sendWindowSeconds.description=The window the send cap is counted over. Changing it starts a fresh count.
labels.setting.login.code.maxAttempts.label=Guesses per code
labels.setting.login.code.maxAttempts.description=How many wrong entries invalidate a code. With 6 digits and 5 guesses in 5 minutes, guessing is not a realistic attack.
labels.setting.login.remember.enabled.label=Keep people signed in
labels.setting.login.remember.enabled.description=Gives each sign-in that is not an admin's a long-lived browser cookie that quietly signs them back in when their session ends. Off also stops honoring every cookie already out there: it is the kill switch.
labels.setting.login.remember.days.label=...for this many days
labels.setting.login.remember.days.description=How long the stay-signed-in cookie lasts, counted from sign-in (using it does not extend it). Signing out or changing the password ends it early.
labels.setting.login.passkey.enabled.label=Offer passkeys
labels.setting.login.passkey.enabled.description=Lets people add a passkey (Face ID, fingerprint, or device lock) after signing in, and sign in with it afterwards. Nobody is required to set one up, and the login page looks the same for anyone without one. Leave OFF until a full register-and-sign-in has been verified against the deployed image; existing passkeys survive the switch being off.
labels.setting.login.password.maxFails.label=Wrong passwords per person
labels.setting.login.password.maxFails.description=After this many wrong passwords for one email address within the window below, sign-in for that address is refused until the window rolls over. 0 turns the throttle off.
labels.setting.login.password.failWindowSeconds.label=...within this many seconds
labels.setting.login.password.failWindowSeconds.description=The window wrong passwords are counted over. Changing it starts a fresh count.
labels.setting.api.token.enabled.label=API bearer tokens
labels.setting.api.token.enabled.description=Lets native and mobile clients sign in over the REST API with bearer tokens (docs/api-tokens.md). Off means no issuance, no refresh, AND no acceptance of tokens already out there: it is the kill switch. Leave it OFF until a client ships.
labels.setting.api.token.access.minutes.label=...access token minutes
labels.setting.api.token.access.minutes.description=How long one access token works before the client must silently refresh. Also bounds how stale the role stamped in a token can be, so shorter is safer.
labels.setting.api.token.refresh.days.label=...refresh token days
labels.setting.api.token.refresh.days.description=How long a signed-in device stays signed in without re-entering credentials, counted from sign-in (refreshing does not extend it). Signing out or a password change ends it early.
labels.setting.api.token.refresh.admin.days.label=...admin refresh days
labels.setting.api.token.refresh.admin.days.description=The refresh lifetime for ADMIN-scoped tokens, shorter than a member's: an admin token is the most valuable credential this system hands out. A month keeps the native app's administrators from signing in weekly; the clamp caps it there.
labels.setting.account.delete.requireSettled.label=Refuse deletion while unsettled
labels.setting.account.delete.requireSettled.description=When on, a person cannot delete their own account while they are registered for a trip that has not ended or owe a balance; the app tells them who to contact. When off, deletion always proceeds (the notice email still shows what is owed). The switch exists so the rule can be relaxed without a deploy if a store review requires it.
labels.setting.account.delete.notify.email.label=Account-deletion notice recipient
labels.setting.account.delete.notify.email.description=Who is told when a person deletes their account: one notice per organization the person belonged to, each listing only that organization's trips and money. Value shape: 'site' = the Site email, 'org' = the owning organization's contact email (falling back to the Site email), 'facilitators' = the trip's facilitators' emails (org-context slots only; falls back like 'org'), anything else = that literal address.
labels.setting.account.delete.notify.from.label=Account-deletion notice From
labels.setting.account.delete.notify.from.description=The From on account-deletion notices. Must be SES-verified. Value shape: 'site' = the Site email, 'org' = the owning organization's contact email (falling back to the Site email), 'facilitators' = the trip's facilitators' emails (org-context slots only; falls back like 'org'), anything else = that literal address.
labels.setting.family.maxMembers.label=Family size limit
labels.setting.family.maxMembers.description=Maximum people in one family account, counting the owner. At the limit the family page stops offering Add and lets the user send a support request instead; raise this here when one arrives. An abuse guard, not a business rule.
labels.setting.reg.allowEdits.label=Registrants may edit their responses
labels.setting.reg.allowEdits.description=On: a traveler who has already registered, pending or confirmed, can still change their answers on the registration page. Off: their answers become read-only; registering itself is unaffected.
labels.setting.trip.tags.label=Trip tags
labels.setting.trip.tags.description=The tags trip editors can put on a trip, comma-separated, in the order the editor offers them. Every organization uses this one list. Renaming a tag in a way that changes more than its capitalization, or removing one, takes it off every trip that had it.
labels.setting.reminders.enabled.label=Send scheduled trip messages
labels.setting.reminders.enabled.description=Runs the once-a-day send of trip messages. A message still goes out only after a trip facilitator approved its wording and date, so turning this on sends nothing by itself.
labels.setting.reminders.hour.label=Hour of day to send
labels.setting.reminders.hour.description=The hour of the day, 0 to 23, in the time zone below. Values outside that range are clamped rather than refused.
labels.setting.reminders.zone.label=Timezone
labels.setting.reminders.zone.description=An IANA zone id, such as America/Los_Angeles. It also decides which day a message's send date is. An unrecognized zone falls back to the default.
labels.setting.reg.mail.baseUrl.label=Link base URL
labels.setting.reg.mail.baseUrl.description=Prefixes the trip/profile links inside registration emails.
labels.setting.support.mail.enabled.label=Email support requests to channel admins
labels.setting.support.mail.enabled.description=A support request (family removal, size-limit increase) posts into the support channel either way; this controls whether the channel's admins are also emailed. Deliberately NOT behind the chat-email master switch: a support request must not be silently swallowed because chat mail is off.
labels.setting.apps.appStore.url.label=App Store listing URL
labels.setting.apps.appStore.url.description=The UniteTrip iOS app's page on the App Store, starting https://apps.apple.com/. The support page shows a Download on the App Store badge linking here; blank leaves the badge off.
labels.setting.apps.playStore.url.label=Google Play listing URL
labels.setting.apps.playStore.url.description=The UniteTrip Android app's page on Google Play, starting https://play.google.com/store/apps/details?id=. The support page shows a Get it on Google Play badge linking here; blank leaves the badge off, which is how it stays until the Play listing is live.
labels.setting.discover.rate.limit.label=Discover requests per address
labels.setting.discover.rate.limit.description=How many Discover requests (the apps' signed-out trip list and search) one network address may make in the window below before it is asked to slow down. Generous on purpose: a whole mobile carrier or an office can share one address.
labels.setting.discover.rate.windowSeconds.label=...within this many seconds
labels.setting.discover.rate.windowSeconds.description=The window the limit above is counted over. Changing it starts a fresh count rather than reinterpreting the one in progress.
labels.setting.finance.treasurer.email.label=Treasurer email
labels.setting.finance.treasurer.email.description=The address a submitted trip expense report is emailed to, as a PDF with its receipts, when the person submitting it chooses to. Blank means no treasurer is known, and the Submit dialog says so.
labels.setting.lodging.bills.autoRecompute.label=Recompute lodging bills automatically
labels.setting.lodging.bills.autoRecompute.description=On: every reservation change, from dates and rooms to a cancellation, recomputes the affected room's lodging bills at once. Off: the ledger stays as it is until someone presses Recompute on the trip's Lodging page.
labels.setting.payment.notify.email.label=Payment notification recipient
labels.setting.payment.notify.email.description=Site-wide fallback address that receives an internal note for each completed payment. An organization's contact email wins when set; blank here means no internal note.
labels.setting.payment.mail.from.label=Payment confirmation From address
labels.setting.payment.mail.from.description=Site-wide fallback From for payment confirmation email, for example Site Name <no-reply@site.org>. The trip's payment settings, then the organization's defaults, win when set. Must be on a verified, shared sending domain, because it goes out for every organization.
labels.setting.payment.confirm.templateId.label=Payment confirmation template
labels.setting.payment.confirm.templateId.description=The MAIL-kind content template used for payment confirmations when neither the trip nor its organization picks one. Installed by install-starter-templates.sh.
labels.setting.payment.fees.paidBy.label=Who pays processor fees
labels.setting.payment.fees.paidBy.description=ORGANIZATION or PAYER; the bottom rung of the trip/org/site ladder. PAYER adds the trip-portion fee on top of the charge; ORGANIZATION absorbs it. A donation's fee share is always absorbed by the organization either way.
labels.setting.payment.returnUrl.allowedPrefixes.label=Allowed payment return addresses
labels.setting.payment.returnUrl.allowedPrefixes.description=Comma-separated. A mobile app supplies its own return and cancel address for a PayPal payment, and anything not starting with one of these is refused. Without the check the payment endpoint is an open redirect: an attacker borrows our PayPal flow to make their own page look like part of this site. Add an app's custom scheme, for example trip://, here before shipping it, not after.
# The export page's column picker (CheckinCommands.exportFieldLabel): the label of a STORED column id. The
# English is the id itself, hyphens and all; question is a typed question's column ({0} its typed text).
labels.exportField.passportCountry=Passport-Country
labels.exportField.passportNumber=Passport-Number
labels.exportField.passportExpiration=Passport-Expiration
labels.exportField.passportPob=Passport-POB
labels.exportField.preferredName=Preferred-Name
labels.exportField.registrationType=Registration-Type
labels.exportField.discountCode=Discount-Code
labels.exportField.checkedIn=Checked-In
labels.exportField.paymentMethod=Payment-Method
labels.exportField.paymentReference=Payment-Reference
labels.exportField.paymentReceived=Payment-Received
labels.exportField.question=Q: {0}
