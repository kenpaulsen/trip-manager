# --- Settings page sections ---
labels.settingSection.site.title=Web-mjesto
labels.settingSection.branding.title=Vizualni identitet
labels.settingSection.branding.note=Izgled vlastitog web-mjesta ORGANIZACIJE, koji organizacija određuje na svojoj stranici Izgled. Web-mjesto organizacije nikad ne nasljeđuje izgled zajedničkog web-mjesta, a logotip, podnožje i kontakti zajedničkog web-mjesta zadani su u njegovim stranicama -- zato se vrijednost upisana ovdje, na stranici Postavke web-mjesta, ne primjenjuje ni na što.
labels.settingSection.emailAddresses.title=E-adrese
labels.settingSection.emailAddresses.note=Sve adrese s kojih aplikacija šalje ili na koje šalje. Adrese pošiljatelja moraju biti na domeni potvrđenoj u SES-u; primatelji i adresa za odgovor mogu biti bilo koja adresa.
labels.settingSection.performance.title=Performanse
labels.settingSection.performance.note=Bliska predmemorija unutar JVM-a, ispred zajedničke predmemorije Valkey. Iz nje se poslužuju samo čitanja čije je mjesto poziva navelo Cached.YES (javne staze i staze prikaza); autentikacija, plaćanja i uređivači uvijek je zaobilaze.
labels.settingSection.pushNotifications.title=Push obavijesti
labels.settingSection.pushNotifications.note=Isporučuje se isključeno: "Šalji push obavijesti" glavni je prekidač, a svaka ruta, značka i tiho osvježavanje ovise o njemu. Svaka osoba i dalje ima vlastiti prekidač, sate tišine i izbor za svaki chat.
labels.settingSection.profilePictures.title=Profilne slike
labels.settingSection.homePage.title=Početna stranica
labels.settingSection.contentTemplates.title=Predlošci sadržaja
labels.settingSection.chatEmail.title=E-pošta chata
labels.settingSection.chatEmail.note=Ništa ovdje samo po sebi ne šalje e-poštu. "Šalji e-poštu chata" glavni je prekidač; dok je isključen, ostalo nema učinka.
labels.settingSection.chatDailyDigest.title=Dnevni sažetak chata
labels.settingSection.chatLimits.title=Ograničenja chata
labels.settingSection.chatLimits.note=Kratkotrajna i trajna ograničenja pojedinog chata nalaze se na stranici postavki chata svakog putovanja. Ovo su ograničenja za cijelo web-mjesto.
labels.settingSection.chatModeration.title=Moderiranje chata
labels.settingSection.chatModeration.note=Prijave sadržaja iz aplikacije stižu primatelju prijava navedenom u nastavku i na njih se odgovara u roku od 24 sata.
labels.settingSection.chatAppearance.title=Izgled chata
labels.settingSection.chatInvites.title=Pozivnice u chat
labels.settingSection.chatInvites.note=Poveznice s pozivnicom primaju kao goste chata osobe s računom koje nisu na putovanju (obitelj, prijatelji). Gost se može ukloniti kao i svatko drugi.
labels.settingSection.photoComments.title=Komentari na fotografije
labels.settingSection.photoComments.note=Niti komentara i reakcije na pojedine fotografije u chatu. E-pošta o spominjanju u komentarima fotografija ovisi o glavnom prekidaču e-pošte chata, navedenom iznad.
labels.settingSection.loginSecurity.title=Prijava u sustav i sigurnost
labels.settingSection.loginSecurity.note=Kodovi za prijavu poslani e-poštom služe i kad je lozinka zaboravljena. E-adrese u ovom odjeljku koriste se za te kodove.
labels.settingSection.accountDeletion.title=Brisanje računa
labels.settingSection.accountDeletion.note=Brisanje vlastitog računa iz izvorne aplikacije: nestaju podaci za prijavu u sustav, profil i sadržaj; zapisi o prijavama na putovanja i o novcu ostaju pod anonimiziranim zapisom.
labels.settingSection.familyAccounts.title=Obiteljski računi
labels.settingSection.registration.title=Prijava na putovanje
labels.settingSection.trips.title=Putovanja
labels.settingSection.scheduledTripMessages.title=Zakazane poruke putovanja
labels.settingSection.scheduledTripMessages.note=Poruke svakog putovanja pišu se i odobravaju na njegovoj stranici Komunikacija (kartica Izvještaji). Ništa ovdje samo po sebi ne šalje e-poštu.
labels.settingSection.registrationEmail.title=E-pošta o prijavi
labels.settingSection.registrationEmail.note=Same poruke koje prima prijavljena osoba predlošci su vrste MAIL koji se uređuju na stranici Predlošci, bez nove isporuke sustava (registration-received / registration-approved).
labels.settingSection.supportRequests.title=Zahtjevi za podršku
labels.settingSection.supportRequests.note=Tko ih prima određuje se na ploči "Administratori kanala podrške", ispod postavki.
labels.settingSection.mobileApps.title=Mobilne aplikacije
labels.settingSection.mobileApps.note=Poveznice na trgovine za značke "Preuzmi aplikaciju" na stranici podrške. Svaka se upisuje kad njezin unos u trgovini postane javan; ništa ih drugo ne čita.
labels.settingSection.discover.title=Otkrivanje
labels.settingSection.discover.note=Popis i pretraga putovanja u aplikacijama bez prijave u sustav, otvoreni svima. Što se prikazuje određuju opcija "Prikaži na početnoj stranici" svakog putovanja i potvrdni okvir "Zajednička web-mjesta" njegove organizacije, a ne ovaj odjeljak; ove vrijednosti samo ograničavaju koliko brzo jedna adresa smije slati upite.
labels.settingSection.finance.title=Financije
labels.settingSection.finance.note=Proračun putovanja i izvještaj o troškovima. Organizacija određuje vlastitog blagajnika na svojoj stranici Konfiguracija; vrijednost upisana ovdje vrijedi za organizacije koje to nisu učinile.
labels.settingSection.lodging.title=Smještaj
labels.settingSection.lodging.note=Hoteli, opcije smještaja i raspored soba. Organizacija koja račune za smještaj usklađuje ručno može isključiti automatski ponovni izračun za vlastita putovanja.
labels.settingSection.payments.title=Plaćanja
labels.settingSection.payments.note=Postavke e-pošte i naknada razina su WEB-MJESTA na ljestvici zadanih vrijednosti putovanje → organizacija → web-mjesto. Popis dopuštenih povratnih adresa vrijedi samo za plaćanja pokrenuta putem API-ja; plaćanje na webu izvodi povratnu adresu iz stranice na kojoj je platitelj bio i nikad ne gleda taj popis.

# --- settings ---
labels.setting.site.org.name.label=Naziv organizacije
labels.setting.site.org.name.description=Naziv organizacije zajedničkog web-mjesta, koji se koristi na njegovim javnim stranicama i u obavijestima kao što je tekst licence pri prijenosu fotografija. Vlastito web-mjesto organizacije umjesto toga prikazuje naziv organizacije iz njezina profila.
labels.setting.site.orgsites.baseDomain.label=Osnovna domena web-mjesta organizacija
labels.setting.site.orgsites.baseDomain.description=Domena pod kojom se nalaze web-mjesta organizacija: organizacija s oznakom 'acme' poslužuje se na acme.<ova domena>. Vršna domena i www predstavljaju promotivno web-mjesto. Promjena djeluje samo ako DNS i certifikat već pokrivaju zamjenski znak nove domene.
labels.setting.mail.sharedDomains.label=Zajedničke domene za slanje
labels.setting.mail.sharedDomains.description=Potvrđene domene za slanje s kojih smije slati svaka organizacija, odvojene zarezima. Svaka druga potvrđena domena prilagođena je domena točno jedne organizacije i samo ona smije slati s nje. Vlastite adrese pošiljatelja web-mjesta koriste isključivo ove domene.
labels.setting.site.analytics.id.label=ID analitičkog svojstva
labels.setting.site.analytics.id.description=Svojstvo web-analitike kojem ovo web-mjesto prijavljuje posjete: ID mjerenja usluge Google Analytics 4, koji počinje s G-. Prazno znači da nema analitičke oznake ni natpisa o kolačićima. Web-mjesto organizacije nikad ne nasljeđuje ID zajedničkog web-mjesta: prijavljuje samo ID-u koji je organizacija sama postavila.
labels.setting.site.languages.label=Ponuđeni jezici
labels.setting.site.languages.description=Jezici koje posjetitelji mogu odabrati, kao kodovi odvojeni zarezima: en za engleski, es za španjolski, hr za hrvatski. Prvi je zadani za posjetitelja čiji jezik nije ponuđen. Kod koji web-mjesto ne poznaje zanemaruje se, a prazan popis znači engleski.
labels.setting.api.languages.minAppVersion.label=Prva verzija aplikacije s jezicima
labels.setting.api.languages.minAppVersion.description=Najstarija verzija aplikacije UniteTrip kojoj se odgovara na jeziku telefona, na primjer 1.3.0. Starije verzije, i sve verzije dok je ovo prazno, dobivaju zadani jezik web-mjesta, jer su njihovi zasloni samo na engleskom.
labels.setting.site.theme.palette.label=Paleta boja
labels.setting.site.theme.palette.description=Istaknuta boja web-mjesta organizacije, koja se koristi za izbornike, gumbe i poveznice u svijetlom i u tamnom načinu. Prazno znači zadani izgled platforme.
labels.setting.site.theme.dark.label=Tamni način
labels.setting.site.theme.dark.description=Uključeno: web-mjesto organizacije prikazuje se u tamnoj temi svoje palete, s tamnom pozadinom stranice, gornjom trakom i izbornikom. Isključeno: svijetla tema. Posjetitelj koji je sam odabrao svijetli ili tamni način zadržava vlastiti izbor.
labels.setting.site.layout.label=Raspored stranice
labels.setting.site.layout.description=Kako je raspoređena početna stranica web-mjesta: classic zadržava karticu sa sadržajem pokraj bočne trake, a full-width dopušta da odjeljci u obliku pojasa, poput naslovnog, zauzmu cijelu širinu prozora. Prazno znači classic. Ostale stranice u oba slučaja zadržavaju klasični raspored.
labels.setting.site.logo.url.label=URL slike logotipa
labels.setting.site.logo.url.description=Logotip koji se prikazuje u gornjoj traci web-mjesta, kao http ili https URL. Kad je prazno, umjesto njega prikazuje se naziv organizacije kao tekst.
labels.setting.site.favicon.url.label=URL ikone web-mjesta
labels.setting.site.favicon.url.description=Ikona koju preglednici prikazuju na karticama web-mjesta, kao http ili https URL. Prazno znači bez ikone, pa preglednik prikazuje svoju opću.
labels.setting.site.ogImage.url.label=URL slike za pretpregled poveznice
labels.setting.site.ogImage.url.description=Slika koju aplikacije za dopisivanje i društvene mreže prikazuju kad netko podijeli poveznicu na web-mjesto, kao http ili https URL. Kad je prazno, koristi se logotip; ako nema ni logotipa, poveznice se prikazuju bez slike.
labels.setting.site.background.url.label=URL pozadinske slike stranice
labels.setting.site.background.url.description=Slika koja se prikazuje iza stranica web-mjesta, kao http ili https URL. Prazno znači bez pozadinske slike, pa se vidi boja pozadine stranice.
labels.setting.site.background.color.label=Boja pozadine stranice
labels.setting.site.background.color.description=Boja koja se prikazuje iza stranica web-mjesta kad nije postavljena pozadinska slika, kao heksadecimalna vrijednost, na primjer #333333. Prazno znači vlastitu pozadinu palete, nijansu njezine boje koja prati izbor tamnog načina.
labels.setting.site.footer.title.label=Naslov podnožja
labels.setting.site.footer.title.description=Naslov podnožja stranice na web-mjestu organizacije. Kad je prazno, prikazuje se naziv organizacije.
labels.setting.site.footer.title.color.label=Boja naslova podnožja
labels.setting.site.footer.title.color.description=Boja naslova podnožja, kao heksadecimalna vrijednost, na primjer #ffffff. Kad je prazno, koristi se boja podnožja same teme, koja odgovara objema rasporedima.
labels.setting.site.footer.text.label=Tekst podnožja
labels.setting.site.footer.text.description=Redak običnog teksta ispod naslova podnožja, na primjer slogan, poštanska adresa ili registracijski broj. Kad je prazno, ondje se ne prikazuje ništa.
labels.setting.site.footer.text.color.label=Boja teksta podnožja
labels.setting.site.footer.text.color.description=Boja retka teksta ispod naslova podnožja, kao heksadecimalna vrijednost, na primjer #ffffff. Kad je prazno, koristi se boja podnožja same teme.
labels.setting.site.footer.links.color.label=Boja poveznica u podnožju
labels.setting.site.footer.links.color.description=Boja poveznica Privatnost, Uvjeti i Podrška u podnožju i točaka između njih, kao heksadecimalna vrijednost, na primjer #ffffff. Kad je prazno, koristi se boja poveznica podnožja same teme.
labels.setting.site.contact.name.label=Ime kontakta
labels.setting.site.contact.name.description=Ime na kartici kontakta u bočnoj traci web-mjesta organizacije, uz kontaktnu e-adresu iz njezina profila. Nikad se ne nasljeđuje od zajedničkog web-mjesta: kad je prazno, ime se izostavlja. Kartica se skriva kad su ime, telefon i e-adresa svi prazni.
labels.setting.site.contact.phone.label=Telefon kontakta
labels.setting.site.contact.phone.description=Telefonski broj na kartici kontakta u bočnoj traci web-mjesta organizacije, prikazan točno onako kako je upisan. Nikad se ne nasljeđuje od zajedničkog web-mjesta: kad je prazno, telefon se izostavlja s kartice.
labels.setting.site.donate.url.label=URL poveznice za donacije
labels.setting.site.donate.url.description=http ili https stranica na koju vode kartica Doniraj i stavka izbornika Doniraj. Nikad se ne nasljeđuje od zajedničkog web-mjesta: prazno znači da se ne prikazuje ni jedno ni drugo.
labels.setting.site.donate.title.label=Naslov kartice Doniraj
labels.setting.site.donate.title.description=Naslov kartice Doniraj u bočnoj traci, na primjer Darujte; kartica se pojavljuje samo kad je postavljen URL poveznice za donacije. Kad je prazno, prikazuje se Doniraj.
labels.setting.site.donate.text.label=Tekst kartice Doniraj
labels.setting.site.donate.text.description=Kratak redak običnog teksta iznad gumba Doniraj, koji kaže čemu donacija pomaže. Kad je prazno, prikazuje se samo gumb.
labels.setting.site.donate.paypalImage.label=PayPalova slika Doniraj
labels.setting.site.donate.paypalImage.description=Uključeno: kartica Doniraj prikazuje PayPalovu žutu sliku gumba Donate umjesto gumba u bojama web-mjesta. Vrijedi samo kad je URL poveznice za donacije stranica na paypal.com; svaka druga poveznica zadržava gumb u bojama teme.
labels.setting.site.title.label=Naslov web-mjesta
labels.setting.site.title.description=Naslov koji preglednici prikazuju na kartici i u oznakama za web-mjesto organizacije, te naziv web-mjesta kad se instalira na početni zaslon telefona. Kad je prazno, koristi se naziv organizacije.
labels.setting.site.sidebar.title.label=Naslov putovanja u bočnoj traci
labels.setting.site.sidebar.title.description=Naslov iznad popisa nadolazećih putovanja u bočnoj traci web-mjesta organizacije, na primjer Duhovne obnove ili Izleti. Kad je prazno, prikazuje se Putovanja.
labels.setting.site.pages.sidebar.label=Bočna traka na uredivim stranicama
labels.setting.site.pages.sidebar.description=Prikazuje ili skriva bočnu traku uz sadržaj uredive stranice. Prva dva izbora zadana su vrijednost koju svaka stranica može promijeniti u svojim postavkama; Skrivena na svakoj stranici skriva je što god stranica kaže.
labels.setting.site.pages.sidebar.choice.on=Prikazana osim ako je stranica skrije
labels.setting.site.pages.sidebar.choice.off=Skrivena osim ako je stranica prikaže
labels.setting.site.pages.sidebar.choice.forcedOff=Skrivena na svakoj stranici
labels.setting.site.mail.email.label=E-adresa web-mjesta
labels.setting.site.mail.email.description=Vlastita adresa web-mjesta: ono što 'E-adresa web-mjesta' znači za svako polje u nastavku, i zamjena kad organizacija nema kontaktnu e-adresu. Koristi se kao pošiljatelj, pa njezina domena mora biti ona s koje SES ima potvrdu za slanje.
labels.setting.reg.mail.from.label=Adresa pošiljatelja
labels.setting.reg.mail.from.description=Poruke o prijavi namijenjene prijavljenoj osobi (zaprimljena/odobrena). Mora biti adresa s koje SES ima potvrdu za slanje, inače nijedna poruka o prijavi ne uspijeva. Oblik vrijednosti: 'site' = e-adresa web-mjesta, 'org' = kontaktna e-adresa organizacije vlasnice (ako je nema, e-adresa web-mjesta), 'facilitators' = e-adrese voditelja putovanja (samo za polja s kontekstom organizacije; zamjena kao za 'org'), sve ostalo = upravo ta adresa.
labels.setting.reg.mail.replyTo.label=Adresa za odgovor
labels.setting.reg.mail.replyTo.description=Kamo stiže odgovor prijavljene osobe. Poruke pozivaju na pitanja, pa bi to trebao biti sandučić koji netko čita. Oblik vrijednosti: 'site' = e-adresa web-mjesta, 'org' = kontaktna e-adresa organizacije vlasnice (ako je nema, e-adresa web-mjesta), 'facilitators' = e-adrese voditelja putovanja (samo za polja s kontekstom organizacije; zamjena kao za 'org'), sve ostalo = upravo ta adresa.
labels.setting.reg.notify.email.label=Primatelj obavijesti o prijavi
labels.setting.reg.notify.email.description=Tko prima interne obavijesti o prijavama (nova, premještena, otkazana). Zadano su to koordinatori putovanja, isti kontakti koji se prikazuju prijavljenoj osobi.
labels.setting.reg.notify.from.label=Pošiljatelj obavijesti o prijavi
labels.setting.reg.notify.from.description=Pošiljatelj internih obavijesti o prijavama. Mora biti potvrđen u SES-u. Oblik vrijednosti: 'site' = e-adresa web-mjesta, 'org' = kontaktna e-adresa organizacije vlasnice (ako je nema, e-adresa web-mjesta), 'facilitators' = e-adrese voditelja putovanja (samo za polja s kontekstom organizacije; zamjena kao za 'org'), sve ostalo = upravo ta adresa.
labels.setting.account.notify.email.label=Primatelj obavijesti o računu
labels.setting.account.notify.email.description=Tko prima interne obavijesti o novom računu. U trenutku otvaranja računa još ne postoji nijedna organizacija, pa ovdje nema opcije organizacije. Zadana vrijednost čuva adresu koja je prije bila upisana u samu stranicu. Oblik vrijednosti: 'site' = e-adresa web-mjesta, 'org' = kontaktna e-adresa organizacije vlasnice (ako je nema, e-adresa web-mjesta), 'facilitators' = e-adrese voditelja putovanja (samo za polja s kontekstom organizacije; zamjena kao za 'org'), sve ostalo = upravo ta adresa.
labels.setting.account.notify.from.label=Pošiljatelj obavijesti o računu
labels.setting.account.notify.from.description=Pošiljatelj internih obavijesti o novom računu. Mora biti potvrđen u SES-u. Oblik vrijednosti: 'site' = e-adresa web-mjesta, 'org' = kontaktna e-adresa organizacije vlasnice (ako je nema, e-adresa web-mjesta), 'facilitators' = e-adrese voditelja putovanja (samo za polja s kontekstom organizacije; zamjena kao za 'org'), sve ostalo = upravo ta adresa.
labels.setting.tx.notify.email.label=Primatelj obavijesti o transakciji
labels.setting.tx.notify.email.description=Tko prima interne obavijesti o spremljenoj transakciji. Zadana vrijednost čuva adresu koja je prije bila upisana u samu stranicu. Oblik vrijednosti: 'site' = e-adresa web-mjesta, 'org' = kontaktna e-adresa organizacije vlasnice (ako je nema, e-adresa web-mjesta), 'facilitators' = e-adrese voditelja putovanja (samo za polja s kontekstom organizacije; zamjena kao za 'org'), sve ostalo = upravo ta adresa.
labels.setting.tx.notify.from.label=Pošiljatelj obavijesti o transakciji
labels.setting.tx.notify.from.description=Pošiljatelj internih obavijesti o spremljenoj transakciji. Mora biti potvrđen u SES-u. Oblik vrijednosti: 'site' = e-adresa web-mjesta, 'org' = kontaktna e-adresa organizacije vlasnice (ako je nema, e-adresa web-mjesta), 'facilitators' = e-adrese voditelja putovanja (samo za polja s kontekstom organizacije; zamjena kao za 'org'), sve ostalo = upravo ta adresa.
labels.setting.login.mail.from.label=Adresa pošiljatelja
labels.setting.login.mail.from.description=Pošiljatelj poruke s kodom za prijavu u sustav. Mora biti adresa s koje SES ima potvrdu za slanje, inače poruka s kodom ne uspijeva. Oblik vrijednosti: 'site' = e-adresa web-mjesta, 'org' = kontaktna e-adresa organizacije vlasnice (ako je nema, e-adresa web-mjesta), 'facilitators' = e-adrese voditelja putovanja (samo za polja s kontekstom organizacije; zamjena kao za 'org'), sve ostalo = upravo ta adresa.
labels.setting.login.mail.replyTo.label=Adresa za odgovor
labels.setting.login.mail.replyTo.description=Kamo ide odgovor na poruku s kodom za prijavu u sustav. Tko zapne na stranici za prijavu u sustav obično odgovori na poruku koju ima pred sobom, pa bi to trebala biti adresa koju čita čovjek.
labels.setting.chat.mail.from.label=Adresa pošiljatelja
labels.setting.chat.mail.from.description=Pošiljatelj e-pošte chata. Mora biti adresa s koje SES ima potvrdu za slanje, inače nijedna poruka e-pošte chata ne uspijeva. Oblik vrijednosti: 'site' = e-adresa web-mjesta, 'org' = kontaktna e-adresa organizacije vlasnice (ako je nema, e-adresa web-mjesta), 'facilitators' = e-adrese voditelja putovanja (samo za polja s kontekstom organizacije; zamjena kao za 'org'), sve ostalo = upravo ta adresa.
labels.setting.chat.mail.replyTo.label=Adresa za odgovor
labels.setting.chat.mail.replyTo.description=Kamo ide odgovor. E-pošta chata nije popis za slanje, pa se odgovori ne isporučuju u chat. Oblik vrijednosti: 'site' = e-adresa web-mjesta, 'org' = kontaktna e-adresa organizacije vlasnice (ako je nema, e-adresa web-mjesta), 'facilitators' = e-adrese voditelja putovanja (samo za polja s kontekstom organizacije; zamjena kao za 'org'), sve ostalo = upravo ta adresa.
labels.setting.support.mail.from.label=Pošiljatelj zahtjeva za podršku
labels.setting.support.mail.from.description=Pošiljatelj e-pošte sa zahtjevom za podršku koja se šalje administratorima kanala podrške. Mora biti potvrđen u SES-u. Oblik vrijednosti: 'site' = e-adresa web-mjesta, 'org' = kontaktna e-adresa organizacije vlasnice (ako je nema, e-adresa web-mjesta), 'facilitators' = e-adrese voditelja putovanja (samo za polja s kontekstom organizacije; zamjena kao za 'org'), sve ostalo = upravo ta adresa.
labels.setting.support.mail.replyTo.label=Adresa za odgovor na zahtjev za podršku
labels.setting.support.mail.replyTo.description=Kamo ide odgovor na poruku sa zahtjevom za podršku. Primatelji su sami administratori kanala podrške (određeni u nastavku), pa je ovo rijetko presudno. Oblik vrijednosti: 'site' = e-adresa web-mjesta, 'org' = kontaktna e-adresa organizacije vlasnice (ako je nema, e-adresa web-mjesta), 'facilitators' = e-adrese voditelja putovanja (samo za polja s kontekstom organizacije; zamjena kao za 'org'), sve ostalo = upravo ta adresa.
labels.setting.cache.near.ttlSeconds.label=TTL bliske predmemorije (sekunde)
labels.setting.cache.near.ttlSeconds.description=Apsolutna gornja granica vremena u kojem bliska predmemorija unutar JVM-a smije posluživati neki unos. Upisi kroz ovu instancu i razaslana poništenja (skripte, administratorska čišćenja) odmah ažuriraju predmemoriju, a provjera stanja u nastavku usklađuje sve ostalo, pa je ova granica važna samo ako oboje zakaže. 0 isključuje blisku predmemoriju. Promjene vrijede čim se spreme; sistemsko svojstvo -Dtrip.cache.near.ttlSeconds u potpunosti nadjačava tablicu postavki.
labels.setting.cache.near.checkSeconds.label=Razmak provjere stanja bliske predmemorije (sekunde)
labels.setting.cache.near.checkSeconds.description=Kad bliska predmemorija pogodi unos čija je posljednja provjera starija od ovoga, JEDNO pozadinsko osvježavanje ponovno čita zajedničku predmemoriju i ažurira unos; sam zahtjev nikad ne čeka. Budući da razaslano poništenje pokriva namjerne upise izvana, ovo je granica usklađivanja samo za obične upise iz DRUGIH JVM-ova (alati naredbenog retka s uključenom predmemorijom, druga instanca) i za propuštena razašiljanja.
labels.setting.metrics.enabled.label=Čuvaj metrike
labels.setting.metrics.enabled.description=Svaki poslužitelj svake minute zapiše nekoliko brojeva o sebi, koji se čuvaju tjedan dana i prikazuju administratorima stranice na stranici metrika svake organizacije. Isključivanjem se zapisivanje prekida sljedeće minute; ono što je već spremljeno nestaje unutar osam dana.
labels.setting.push.enabled.label=Šalji push obavijesti
labels.setting.push.enabled.description=Glavni prekidač za sve push obavijesti (APNs prema aplikaciji, Web Push prema preglednicima): spominjanja i odgovori u chatu, pretplate na sve poruke pojedinog kanala, odobrenja prijava, potvrde uplata, zahtjevi za podršku, značke i tiha osvježavanja. Isključeno znači da se ne šalje ništa, što god pisalo u nečijim osobnim postavkama. Najprije mora biti isporučena tajna za push (APNs ključ i VAPID par).
labels.setting.push.apns.topic.label=APNs tema
labels.setting.push.apns.topic.description=Identifikator paketa aplikacije, koji se šalje kao apns-topic. Token koji je registrirala aplikacija s drugim identifikatorom paketa Apple odbija (DeviceTokenNotForTopic) i on se uklanja.
labels.setting.push.silent.intervalMinutes.label=Razmak tihog osvježavanja (minute)
labels.setting.push.silent.intervalMinutes.description=Nakon aktivnosti u chatu telefoni koji NISU dobili upozorenje dobivaju najviše jednu push poruku za pozadinsko osvježavanje u ovoliko minuta, kako bi značka i brojači nepročitanog ostali svježi bez otvaranja aplikacije. 0 isključuje tiha osvježavanja; raspon je od 0 do 240.
labels.setting.push.web.enabled.label=Push prema preglednicima (Web Push)
labels.setting.push.web.enabled.description=Vlastiti prekidač rute za preglednike, ispod glavnog prekidača navedenog iznad: isključeno znači da pretplaćeni preglednici ne primaju ništa, dok telefoni i dalje rade.
labels.setting.profile.bgRemoval.enabled.label=Ponudi uklanjanje pozadine
labels.setting.profile.bgRemoval.enabled.description=Dodaje profilnim slikama opciju "zamijeni pozadinu": model strojnog učenja na poslužitelju (U^2-Net-small putem ONNX Runtimea) izrezuje osobu, a odabrana boja ispunjava prostor iza nje. Dok se koristi, model zauzima nekoliko stotina MB memorije zadatka; oslobađa se nakon 10 minuta mirovanja (sljedeća uporaba ponovno plaća oko 1 s učitavanja modela).
labels.setting.home.banner.enabled.label=Prikaži natpis
labels.setting.home.banner.enabled.description=Prikazuje obavijest na vrhu javne početne stranice. Natpisu je potreban i njegov tekst, u nastavku.
labels.setting.home.banner.text.label=Tekst natpisa
labels.setting.home.banner.text.description=Sama obavijest. Kad je prazno, natpis je skriven čak i kad je Prikaži natpis uključeno.
labels.setting.home.photos.windowDays.label=Slike iz posljednjih (dana)
labels.setting.home.photos.windowDays.description=Koliko dana nakon završetka putovanja njegove fotografije ostaju na početnoj stranici. Albumi starijih putovanja sami nestaju s trake s fotografijama.
labels.setting.home.photos.minCount.label=Najmanji broj slika po putovanju
labels.setting.home.photos.minCount.description=Najmanji broj javno prikazanih fotografija koji putovanje treba da bi se njegov album pojavio na početnoj stranici. Putovanje s manje fotografija ne ulazi u traku s fotografijama.
labels.setting.home.countdown.soonDays.label=Dodatna odbrojavanja unutar (dana)
labels.setting.home.countdown.soonDays.description=Bočna traka uvijek odbrojava do sljedećeg putovanja na svakom jeziku; putovanje koje počinje unutar ovoliko dana također dobiva odbrojavanje, čak i ako je iza drugog putovanja na istom jeziku.
labels.setting.content.versions.retained.label=Broj sačuvanih verzija sadržaja
labels.setting.content.versions.retained.description=Koliko se prethodnih verzija svakog predloška sadržaja i svake stavke sadržaja stranice čuva za poništavanje. Smanjenje skraćuje povijest pri sljedećem spremanju svake stavke.
labels.setting.chat.mail.enabled.label=Šalji e-poštu chata
labels.setting.chat.mail.enabled.description=Glavni prekidač za svu e-poštu chata, uključujući spominjanja i dnevni sažetak. Isključeno znači da chat ne šalje nikakvu e-poštu, što god pisalo u nečijim osobnim postavkama.
labels.setting.chat.mail.baseUrl.label=Adresa web-mjesta u poveznicama
labels.setting.chat.mail.baseUrl.description=Stavlja se ispred poveznica u e-pošti chata. Pogrešna vrijednost šalje ljude na krivo web-mjesto, ili nikamo.
labels.setting.chat.digest.enabled.label=Šalji dnevni sažetak
labels.setting.chat.digest.enabled.description=Pokreće sažetak koji izlazi jednom dnevno. Svaka se osoba i dalje mora sama uključiti, a nikome tko nema ništa novo ne šalje se poruka.
labels.setting.chat.digest.hour.label=Sat slanja u danu
labels.setting.chat.digest.hour.description=Sat u danu, od 0 do 23, u vremenskoj zoni navedenoj u nastavku. Vrijednosti izvan tog raspona svode se na granicu umjesto da se odbiju.
labels.setting.chat.digest.zone.label=Vremenska zona
labels.setting.chat.digest.zone.description=IANA oznaka zone, na primjer America/Los_Angeles. Za neprepoznatu zonu koristi se zadana.
labels.setting.chat.global.limit.label=Poruka po osobi, svi chatovi
labels.setting.chat.global.limit.description=Gornja granica za sve chatove u kojima je osoba, povrh kratkotrajnih i trajnih ograničenja svakog chata. Povećanje ne ublažava ograničenja pojedinog chata.
labels.setting.chat.global.windowSeconds.label=...unutar ovoliko sekundi
labels.setting.chat.global.windowSeconds.description=Razdoblje u kojem se broji gornje ograničenje. Promjena započinje novo brojanje umjesto da se ono u tijeku tumači iznova.
labels.setting.chat.edit.windowMinutes.label=Rok za autorovo uređivanje (minute)
labels.setting.chat.edit.windowMinutes.description=Koliko dugo netko smije ispravljati vlastitu poruku. Namjerno kratko: uređivanje mijenja ono što su drugi već pročitali, pa je ovo za ispravak tipfelera, a ne za prepravljanje povijesti.
labels.setting.chat.autoMute.triggerCount.label=Broj dosezanja ograničenja prije automatskog utišavanja
labels.setting.chat.autoMute.triggerCount.description=Koliko puta netko smije dosegnuti ograničenje prije nego što bude automatski utišan.
labels.setting.chat.autoMute.triggerWindowSeconds.label=...unutar ovoliko sekundi
labels.setting.chat.autoMute.triggerWindowSeconds.description=Razdoblje u kojem se ta dosezanja broje.
labels.setting.chat.autoMute.ladderMinutes.label=Trajanja utišavanja, u minutama
labels.setting.chat.autoMute.ladderMinutes.description=Odvojena zarezima i rastuća: prvo automatsko utišavanje koristi prvu vrijednost, sljedeće drugu i tako dalje, a posljednja se ponavlja. Za neispravan popis koristi se zadana vrijednost.
labels.setting.chat.autoMute.tierDecayHours.label=Stupnjevanje se zaboravlja nakon (sati)
labels.setting.chat.autoMute.tierDecayHours.description=Koliko dugo treba trajati dobro ponašanje da se netko spusti niz gornju ljestvicu.
labels.setting.chat.alarm.dedupeWindowSeconds.label=Zapisi alarma: najviše jedan u (sekundi)
labels.setting.chat.alarm.dedupeWindowSeconds.description=Alarmi o zlouporabi idu u revizijski trag, u koji se samo dodaje i koji nikad ne istječe, pa se unutar ovog razdoblja svode na jedan po osobi i po chatu. Smanjenje omogućuje skripti da napuni trag.
labels.setting.chat.blockedTerms.label=Blokirane riječi
labels.setting.chat.blockedTerms.description=Odvojene zarezima. Poruka u chatu ili komentar na fotografiju koji sadrži jednu od njih kao cijelu riječ odbija se uz objašnjenje. Ne razlikuju se velika i mala slova. Prazno isključuje filtar; moderiranje (prijave sadržaja, utišavanja, uklanjanja) radi u oba slučaja.
labels.setting.moderation.report.email.label=Primatelj prijava sadržaja
labels.setting.moderation.report.email.description=Kome se šalje e-pošta kad netko prijavi poruku u chatu, fotografiju ili komentar. Na prijave u roku od 24 sata odgovara onaj tko ih primi; to obećavaju Uvjeti korištenja. Oblik vrijednosti: 'site' = e-adresa web-mjesta, 'org' = kontaktna e-adresa organizacije vlasnice (ako je nema, e-adresa web-mjesta), 'facilitators' = e-adrese voditelja putovanja (samo za polja s kontekstom organizacije; zamjena kao za 'org'), sve ostalo = upravo ta adresa.
labels.setting.moderation.report.from.label=Pošiljatelj prijava sadržaja
labels.setting.moderation.report.from.description=Pošiljatelj e-pošte s prijavom sadržaja. Mora biti potvrđen u SES-u. Oblik vrijednosti: 'site' = e-adresa web-mjesta, 'org' = kontaktna e-adresa organizacije vlasnice (ako je nema, e-adresa web-mjesta), 'facilitators' = e-adrese voditelja putovanja (samo za polja s kontekstom organizacije; zamjena kao za 'org'), sve ostalo = upravo ta adresa.
labels.setting.moderation.platform.email.label=Kopija za platformu
labels.setting.moderation.platform.email.description=Ovamo stiže skrivena kopija svake prijave sadržaja i svake obavijesti o brisanju računa, kako bi ih operater platforme vidio bez obzira na to što je organizacija postavila. Prazno znači bez kopije.
labels.setting.chat.reactions.palette.label=Emojiji za reakcije
labels.setting.chat.reactions.palette.description=Emojiji kojima se smije reagirati, odvojeni zarezima, redoslijedom kojim se nude. Svaki se uspoređuje doslovno, a već dane reakcije s uklonjenim emojijem ostaju, ali se više ne nude.
labels.setting.chat.background.colors.label=Ponuđene boje pozadine
labels.setting.chat.background.colors.description=Boje koje se mogu odabrati za pozadinu chata, odvojene zarezima i ponuđene ovim redoslijedom. Unos koji nije obična vrijednost #rrggbb ili CSS naziv boje odbacuje se, jer se vrijednost upisuje u stilove stranice.
labels.setting.chat.background.image.label=Zadana pozadinska slika
labels.setting.chat.background.image.description=Slika koja se prikazuje izblijedjela iza poruka kad je nisu odabrali ni putovanje ni osoba, kao http ili https URL. Prazno znači bez ikakve slike.
labels.setting.chat.invites.enabled.label=Dopusti poveznice s pozivnicom
labels.setting.chat.invites.enabled.description=Omogućuje sudionicima chata da poveznicom ili QR kodom pozovu osobe koje nisu na putovanju, primjerice obitelj i prijatelje. Isključeno odbija nove poveznice I sprječava iskorištavanje postojećih; gosti koji su već u chatu ostaju.
labels.setting.chat.invites.expiryDays.label=Trajanje poveznice s pozivnicom (dana)
labels.setting.chat.invites.expiryDays.description=Koliko dugo nova poveznica s pozivnicom vrijedi. Što god ovdje pisalo, poveznica nikad ne nadživi sam chat: istek je ograničen vremenom arhiviranja chata.
labels.setting.chat.invites.maxPerChannel.label=Važećih poveznica po chatu
labels.setting.chat.invites.maxPerChannel.description=Koliko neisteklih poveznica s pozivnicom jedan chat smije imati istodobno. Istekle i opozvane poveznice same se prestaju brojiti.
labels.setting.chat.photoComments.enabled.label=Komentari i reakcije na fotografije
labels.setting.chat.photoComments.enabled.description=Niti komentara i reakcije emojijima na pojedine fotografije u chatu (preglednik albuma, uvećani prikaz u chatu i javna odredišna stranica). Isključivanje skriva ploču i odbija nove objave; postojeći komentari ostaju sačuvani.
labels.setting.chat.photoComments.maxChars.label=Duljina komentara na fotografiju
labels.setting.chat.photoComments.maxChars.description=Najveća dopuštena duljina komentara na fotografiju, u znakovima. Namjerno kraće od poruke u chatu: ploča pokraj fotografije prostor je veličine potpisa pod slikom, a ne drugi chat.
labels.setting.login.code.enabled.label=Ponudi kodove za prijavu e-poštom
labels.setting.login.code.enabled.description=Omogućuje prijavu u sustav kratkim kodom poslanim e-poštom umjesto lozinkom. To je i put za zaboravljenu lozinku, pa isključivanjem "zatraži pomoć" ostaje jedini način oporavka.
labels.setting.login.code.length.label=Duljina koda (znamenke)
labels.setting.login.code.length.description=Koliko znamenki ima kod za prijavu u sustav. Dulji je teže pogoditi i teže upisati; 6 odgovara onome što ljudi viđaju svugdje drugdje.
labels.setting.login.code.ttlSeconds.label=Valjanost koda (sekunde)
labels.setting.login.code.ttlSeconds.description=Koliko dugo kod vrijedi nakon slanja. Spora dostava e-pošte troši dio tog vremena, pa vrlo niska vrijednost uglavnom onemogućuje ljude sa sporim pružateljima e-pošte.
labels.setting.login.code.maxSends.label=Poslanih kodova po osobi
labels.setting.login.code.maxSends.description=Koliko se kodova može poslati na jednu e-adresu unutar razdoblja navedenog u nastavku. Ograničenje količine e-pošte, i uporabe stranice za prijavu u sustav za dosađivanje nečijem sandučiću.
labels.setting.login.code.sendWindowSeconds.label=...unutar ovoliko sekundi
labels.setting.login.code.sendWindowSeconds.description=Razdoblje u kojem se broji ograničenje slanja. Promjena započinje novo brojanje.
labels.setting.login.code.maxAttempts.label=Pokušaja po kodu
labels.setting.login.code.maxAttempts.description=Koliko pogrešnih unosa poništava kod. Uz 6 znamenki i 5 pokušaja u 5 minuta pogađanje nije stvaran napad.
labels.setting.login.remember.enabled.label=Zadrži prijavu u sustav
labels.setting.login.remember.enabled.description=Svakoj prijavi u sustav koja nije administratorska daje dugotrajan kolačić preglednika koji osobu neprimjetno ponovno prijavljuje kad joj sesija završi. Isključeno ujedno prestaje priznavati sve već izdane kolačiće: to je prekidač za nuždu.
labels.setting.login.remember.days.label=...ovoliko dana
labels.setting.login.remember.days.description=Koliko dugo traje kolačić za zadržavanje prijave, računajući od prijave u sustav (uporaba ga ne produljuje). Odjava ili promjena lozinke prekida ga ranije.
labels.setting.login.passkey.enabled.label=Ponudi pristupne ključeve
labels.setting.login.passkey.enabled.description=Omogućuje dodavanje pristupnog ključa (Face ID, otisak prsta ili zaključavanje uređaja) nakon prijave u sustav i kasniju prijavu njime. Nitko ga nije dužan postaviti, a stranica za prijavu u sustav izgleda jednako svima koji ga nemaju. Neka ostane ISKLJUČENO dok se cijela registracija i prijava ne provjere na isporučenoj slici sustava; postojeći pristupni ključevi ostaju sačuvani i dok je prekidač isključen.
labels.setting.login.password.maxFails.label=Pogrešnih lozinki po osobi
labels.setting.login.password.maxFails.description=Nakon ovoliko pogrešnih lozinki za jednu e-adresu unutar razdoblja navedenog u nastavku, prijava u sustav za tu adresu odbija se dok razdoblje ne istekne. 0 isključuje ovo ograničenje.
labels.setting.login.password.failWindowSeconds.label=...unutar ovoliko sekundi
labels.setting.login.password.failWindowSeconds.description=Razdoblje u kojem se broje pogrešne lozinke. Promjena započinje novo brojanje.
labels.setting.api.token.enabled.label=API bearer tokeni
labels.setting.api.token.enabled.description=Omogućuje izvornim i mobilnim klijentima prijavu u sustav putem REST API-ja s bearer tokenima (docs/api-tokens.md). Isključeno znači da nema izdavanja, nema obnavljanja I nema prihvaćanja već izdanih tokena: to je prekidač za nuždu. Neka ostane ISKLJUČENO dok se ne objavi neki klijent.
labels.setting.api.token.access.minutes.label=...minuta pristupnog tokena
labels.setting.api.token.access.minutes.description=Koliko dugo jedan pristupni token vrijedi prije nego što ga klijent mora neprimjetno obnoviti. Ujedno ograničava koliko zastarjela može biti uloga upisana u token, pa je kraće sigurnije.
labels.setting.api.token.refresh.days.label=...dana tokena za obnavljanje
labels.setting.api.token.refresh.days.description=Koliko dugo prijavljeni uređaj ostaje prijavljen bez ponovnog unosa vjerodajnica, računajući od prijave u sustav (obnavljanje ga ne produljuje). Odjava ili promjena lozinke prekida ga ranije.
labels.setting.api.token.refresh.admin.days.label=...dana obnavljanja za administratore
labels.setting.api.token.refresh.admin.days.description=Trajanje obnavljanja za tokene s ADMINISTRATORSKIM opsegom, kraće nego za člana: administratorski token najvrjednija je vjerodajnica koju ovaj sustav izdaje. Mjesec dana pošteđuje administratore izvorne aplikacije tjedne prijave u sustav; vrijednost je ograničena na toliko.
labels.setting.account.delete.requireSettled.label=Odbij brisanje dok ima nepodmirenog
labels.setting.account.delete.requireSettled.description=Uključeno: osoba ne može izbrisati vlastiti račun dok je prijavljena na putovanje koje nije završilo ili dok duguje neki iznos; aplikacija joj kaže kome se obratiti. Isključeno: brisanje se uvijek provodi (obavijest e-poštom i dalje prikazuje što se duguje). Prekidač postoji kako bi se pravilo moglo ublažiti bez nove isporuke sustava ako to zatraži pregled u trgovini aplikacija.
labels.setting.account.delete.notify.email.label=Primatelj obavijesti o brisanju računa
labels.setting.account.delete.notify.email.description=Tko se obavještava kad osoba izbriše svoj račun: jedna obavijest po organizaciji kojoj je osoba pripadala, a svaka navodi samo putovanja i novac te organizacije. Oblik vrijednosti: 'site' = e-adresa web-mjesta, 'org' = kontaktna e-adresa organizacije vlasnice (ako je nema, e-adresa web-mjesta), 'facilitators' = e-adrese voditelja putovanja (samo za polja s kontekstom organizacije; zamjena kao za 'org'), sve ostalo = upravo ta adresa.
labels.setting.account.delete.notify.from.label=Pošiljatelj obavijesti o brisanju računa
labels.setting.account.delete.notify.from.description=Pošiljatelj obavijesti o brisanju računa. Mora biti potvrđen u SES-u. Oblik vrijednosti: 'site' = e-adresa web-mjesta, 'org' = kontaktna e-adresa organizacije vlasnice (ako je nema, e-adresa web-mjesta), 'facilitators' = e-adrese voditelja putovanja (samo za polja s kontekstom organizacije; zamjena kao za 'org'), sve ostalo = upravo ta adresa.
labels.setting.family.maxMembers.label=Ograničenje veličine obitelji
labels.setting.family.maxMembers.description=Najveći broj osoba u jednom obiteljskom računu, računajući vlasnika. Na granici stranica obitelji prestaje nuditi Dodaj i umjesto toga omogućuje slanje zahtjeva za podršku; kad takav zahtjev stigne, ova se vrijednost ovdje povećava. Zaštita od zlouporabe, a ne poslovno pravilo.
labels.setting.reg.allowEdits.label=Prijavljene osobe smiju uređivati svoje odgovore
labels.setting.reg.allowEdits.description=Uključeno: putnik koji se već prijavio, na čekanju ili potvrđen, i dalje može mijenjati svoje odgovore na stranici prijave. Isključeno: njegovi se odgovori mogu samo čitati; na samu prijavu to ne utječe.
labels.setting.trip.tags.label=Oznake putovanja
labels.setting.trip.tags.description=Oznake koje urednici mogu staviti na putovanje, odvojene zarezima, redoslijedom kojim ih uređivač nudi. Sve organizacije koriste ovaj jedan popis. Preimenovanje oznake koje mijenja više od velikih i malih slova, ili njezino uklanjanje, skida je sa svakog putovanja koje ju je imalo.
labels.setting.reminders.enabled.label=Šalji zakazane poruke putovanja
labels.setting.reminders.enabled.description=Pokreće slanje poruka putovanja koje se obavlja jednom dnevno. Poruka i dalje izlazi tek nakon što voditelj putovanja odobri njezin tekst i datum, pa uključivanje samo po sebi ne šalje ništa.
labels.setting.reminders.hour.label=Sat slanja u danu
labels.setting.reminders.hour.description=Sat u danu, od 0 do 23, u vremenskoj zoni navedenoj u nastavku. Vrijednosti izvan tog raspona svode se na granicu umjesto da se odbiju.
labels.setting.reminders.zone.label=Vremenska zona
labels.setting.reminders.zone.description=IANA oznaka zone, na primjer America/Los_Angeles. Ona određuje i na koji dan pada datum slanja poruke. Za neprepoznatu zonu koristi se zadana.
labels.setting.reg.mail.baseUrl.label=Osnovni URL poveznica
labels.setting.reg.mail.baseUrl.description=Stavlja se ispred poveznica na putovanje i profil u porukama o prijavi.
labels.setting.support.mail.enabled.label=Šalji zahtjeve za podršku e-poštom administratorima kanala
labels.setting.support.mail.enabled.description=Zahtjev za podršku (uklanjanje iz obitelji, povećanje ograničenja veličine) u svakom se slučaju objavljuje u kanalu podrške; ovo određuje šalje li se administratorima kanala i e-pošta. Namjerno NE ovisi o glavnom prekidaču e-pošte chata: zahtjev za podršku ne smije nečujno nestati zato što je e-pošta chata isključena.
labels.setting.apps.appStore.url.label=URL unosa u App Storeu
labels.setting.apps.appStore.url.description=Stranica aplikacije UniteTrip za iOS u App Storeu, koja počinje s https://apps.apple.com/. Stranica podrške prikazuje značku Download on the App Store s poveznicom ovamo; kad je prazno, značka se izostavlja.
labels.setting.apps.playStore.url.label=URL unosa na Google Playu
labels.setting.apps.playStore.url.description=Stranica aplikacije UniteTrip za Android na Google Playu, koja počinje s https://play.google.com/store/apps/details?id=. Stranica podrške prikazuje značku Get it on Google Play s poveznicom ovamo; kad je prazno, značka se izostavlja, i tako ostaje dok unos na Playu ne postane javan.
labels.setting.discover.rate.limit.label=Zahtjeva za Otkrivanje po adresi
labels.setting.discover.rate.limit.description=Koliko zahtjeva za Otkrivanje (popis i pretraga putovanja u aplikacijama bez prijave u sustav) jedna mrežna adresa smije poslati u razdoblju navedenom u nastavku prije nego što se od nje zatraži da uspori. Namjerno izdašno: cijeli mobilni operater ili ured može dijeliti jednu adresu.
labels.setting.discover.rate.windowSeconds.label=...unutar ovoliko sekundi
labels.setting.discover.rate.windowSeconds.description=Razdoblje u kojem se broji gornje ograničenje. Promjena započinje novo brojanje umjesto da se ono u tijeku tumači iznova.
labels.setting.finance.treasurer.email.label=E-adresa blagajnika
labels.setting.finance.treasurer.email.description=Adresa na koju se predani izvještaj o troškovima putovanja šalje e-poštom, kao PDF s računima, kad osoba koja ga predaje to odabere. Prazno znači da blagajnik nije poznat, i dijalog Predaj to kaže.
labels.setting.lodging.bills.autoRecompute.label=Automatski ponovno izračunaj račune za smještaj
labels.setting.lodging.bills.autoRecompute.description=Uključeno: svaka promjena rezervacije, od datuma i soba do otkazivanja, odmah ponovno izračunava račune za smještaj za dotičnu sobu. Isključeno: knjiga ostaje kakva jest dok netko ne pritisne Ponovno izračunaj na stranici Smještaj tog putovanja.
labels.setting.payment.notify.email.label=Primatelj obavijesti o uplati
labels.setting.payment.notify.email.description=Adresa, ili više njih odvojenih zarezima, koja prima internu kopiju svake e-poruke o uplati: potvrde i obavijest da bankovna uplata nije prošla. Za uplate organizacije kopija se šalje samo na adresu iz vlastitih postavki te organizacije; ako je ondje prazno, kopija se ne šalje. Adresa u postavkama web-mjesta koristi se samo za uplate bez organizacije.
labels.setting.payment.mail.from.label=Adresa pošiljatelja potvrde uplate
labels.setting.payment.mail.from.description=Zamjenski pošiljatelj za cijelo web-mjesto za e-poštu s potvrdom uplate, na primjer Naziv Web-mjesta <no-reply@site.org>. Postavke plaćanja putovanja, a zatim zadane vrijednosti organizacije, imaju prednost kad su postavljene. Mora biti na potvrđenoj, zajedničkoj domeni za slanje, jer se šalje u ime svake organizacije.
labels.setting.payment.confirm.templateId.label=Predložak potvrde uplate
labels.setting.payment.confirm.templateId.description=Predložak sadržaja vrste MAIL koji se koristi za potvrde uplata kad ga ne odaberu ni putovanje ni njegova organizacija. Instalira ga install-starter-templates.sh.
labels.setting.payment.fees.paidBy.label=Tko plaća naknade procesora
labels.setting.payment.fees.paidBy.description=ORGANIZATION ili PAYER; najniža razina ljestvice putovanje/organizacija/web-mjesto. PAYER dodaje naknadu za dio koji se odnosi na putovanje povrh naplate; ORGANIZATION je preuzima. Udio naknade koji se odnosi na donaciju u oba slučaja uvijek preuzima organizacija.
labels.setting.payment.returnUrl.allowedPrefixes.label=Dopuštene povratne adrese plaćanja
labels.setting.payment.returnUrl.allowedPrefixes.description=Odvojene zarezima. Mobilna aplikacija navodi vlastitu adresu povratka i odustajanja za plaćanje PayPalom, i sve što ne počinje jednom od ovih odbija se. Bez te provjere krajnja točka plaćanja otvoreno je preusmjeravanje: napadač se posluži našim PayPal tijekom kako bi vlastita stranica izgledala kao dio ovog web-mjesta. Prilagođena shema aplikacije, na primjer trip://, dodaje se ovdje prije njezine objave, a ne poslije.
labels.exportField.passportCountry=Država putovnice
labels.exportField.passportNumber=Br. putovnice
labels.exportField.passportExpiration=Istek putovnice
labels.exportField.passportPob=Mjesto rođenja (putovnica)
labels.exportField.preferredName=Željeno ime
labels.exportField.registrationType=Vrsta prijave
labels.exportField.discountCode=Kod za popust
labels.exportField.checkedIn=Dolazak prijavljen
labels.exportField.paymentMethod=Način plaćanja
labels.exportField.paymentReference=Referenca uplate
labels.exportField.paymentReceived=Uplata primljena
labels.exportField.question=P: {0}
